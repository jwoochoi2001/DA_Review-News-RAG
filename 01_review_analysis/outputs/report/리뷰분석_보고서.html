ifficult to use. The slightest amount of pressure sends the thing collapsing on itself while in use. It got so hot at one point that it wouldn’t even stay put, it collapsed in on itself on one side and I couldn’t get it to work. I gave up and decided to return it. I can’t see how they even charge $15 for this item. It’s terrible! I’d rather purchase a hair dryer with a hard diffuser included. Don’t waste your time or money on this item.","d":"2019-03","h":0,"v":true},"AB0262894":{"r":3,"t":"Good diffuser, but collapses while using.","x":"I like the idea that this is a collapsible product, however it does just that when using it. I used it on the lowest heat and blow setting and when I barely pressed it against my head, it would collapse if I wasn't super careful. Just wish it was made just slightly more sturdy.","d":"2016-08","h":1,"v":true},"AB0264695":{"r":1,"t":"Too small.","x":"Wanted to love this but sending it back. My blow dryer is standard size and it doesn’t fit. Very disappointed. 😢","d":"2020-08","h":0,"v":true},"AB0266074":{"r":3,"t":"Three Stars","x":"Collapses when using","d":"2018-03","h":0,"v":true},"AB0267933":{"r":3,"t":"Annoying but functional","x":"This diffuser works, it’s just a little annoying to use. The collapsible feature is only convenient because it’s easy to pack if you travel a lot. But it will collapse while you’re using it. I’ll probably buy a normal one for regular use and just use this one for travel.","d":"2018-05","h":0,"v":true},"AB0268859":{"r":1,"t":"Now that is an awesome diffuser!","x":"Ineffective. Diffuser keeps collapsing while you try to dry your hair. Took more time for me to dry my hair because of this. Don't think I would be using it again. If you are planning to get this don't. Get the xtava black orchid (or white) instead. Now that is an awesome diffuser!","d":"2017-03","h":1,"v":true},"AB0269083":{"r":2,"t":"Poor quality - rubber part rips","x":"I loved this diffuser, worked super well for curly hair to reduce frizz - However, after a few months, the rubber part which attaches to the hairdryer ripped, so it is unusable. I only used it on a small hair dryer and MAYBE twice a week. Pretty disappointed.","d":"2018-11","h":0,"v":true},"AB0269890":{"r":1,"t":"Good","x":"Didn’t fit on the blow dryer parlux","d":"2019-09","h":0,"v":true},"AB0270939":{"r":1,"t":"Not Original","x":"I thought it was an original, but I do not think so. Very bad quality. When I use it, it collapses and does not stay open.","d":"2018-09","h":0,"v":true},"AB0271282":{"r":3,"t":"Three Stars","x":"I like my old one - going back","d":"2016-07","h":0,"v":true},"AB0274499":{"r":2,"t":"It doesn’t stay open","x":"It doesn’t stay open no matter what. As soon as it slightly touches the hair it collapses back and it becomes unusable.","d":"2020-12","h":0,"v":true},"AB0274611":{"r":1,"t":"It was broken :(","x":"The product arrived on time, but it was broken. I opened the plastic bag and found a small part broken, when I tried to open the collapsible diffuser it broke even worst. It seems to be a good product and just what I needed for my travel size hair dryer, but I won't be able to use it.","d":"2018-10","h":0,"v":true},"AB0275380":{"r":1,"t":"Unusable. Keeps collapsing.","x":"Not usable. Keeps collapsing.","d":"2020-10","h":0,"v":true},"AB0275891":{"r":3,"t":"Poor fit","x":"Doesn't fit properly. I've tried multiple hairdryers","d":"2020-01","h":0,"v":true},"AB0276045":{"r":2,"t":"Did not fit","x":"Did not fit my hair dryer as described. Returned","d":"2016-08","h":1,"v":true},"AB0278443":{"r":2,"t":"The diffuser the new blow dryer came with works jus as good.","x":"Had to get a new blow dryer. Does not fit all dryers.","d":"2018-06","h":0,"v":true},"AB0283272":{"r":2,"t":"I bought this to save space in my luggage. ...","x":"I bought this to save space in my luggage. It did not fit the hotel dryer. It does fit my xtava dryer, however, it collapses while in use making drying very frustrating. I also did not get the results that I get from my orchid diffuser. After about only 4 uses I noticed that the plastic piece inside the diffuser has melted. I will stick with my orchid diffuser and just buy a bigger suitcase.","d":"2017-08","h":1,"v":true},"AB0285037":{"r":2,"t":"Travel Friendly...that’s it though.","x":"The fact that it collapses actually drives me nuts. I guess if I need to travel with it. I’ll deal!","d":"2019-02","h":0,"v":true},"AB0285657":{"r":1,"t":"Boo","x":"Sadly it split the first time I put it on my hairdryer","d":"2017-11","h":0,"v":true},"AB0287391":{"r":3,"t":"Collapses while using","x":"Great diffuser, I’m use to the sturdy non collapsing ones from Conair. The only thing I don’t like, is that it keeps collapsing while I’m using it. Makes it difficult to properly dry my hair and slows down the process. It’s just annoying","d":"2020-09","h":0,"v":true},"AB0288104":{"r":1,"t":"Not right for me.","x":"I could not get this on my home dryer. It will fit on my travel dryer, but goes on so deep you don't get the full diffusion of air.","d":"2016-08","h":1,"v":true},"AB0288612":{"r":2,"t":"Collapsible","x":"Collapsible is the key word. It collapses continuously when trying to dry your hair!","d":"2021-06","h":0,"v":true},"AB0289834":{"r":3,"t":"Frustrating but works well enough.","x":"I bought the collapsible diffuser to save room in our drawer (we live in a RV) but I’m finding the thing so annoying! It always buckles when I have my hair on it and held up to my head. Then I have to grab the very hot silicon with my bare fingers. It’s a constant battle. With that being said, it does work well (when it stays put) and fit my Babyliss blow dryer perfectly.","d":"2017-12","h":1,"v":true},"AB0290465":{"r":2,"t":"A little disappointed","x":"First, I was very excited to get this and high hopes. Says it fits most standard hair dryers but I think it runs on the small side. I had to take the plastic difusser plate put to stretch it onto the dryer. Not coming off easily!! The plastic plate that has holes in it falls out easy and it not attached by any lip or glue to hold it in. Fine while using it upright but otherwise constantly putting back in is a hassle. I have long hair. While this is big, the middle of my hair falls over the sides. Not the products fault but may not be the best option for long hair. I think that is just a me problem to figure out. Overall, works great as a diffuser. Did leave my curls better defined but I will be looking for a different diffuser that isn't such a hassle.","d":"2021-03","h":0,"v":true},"AB0290655":{"r":2,"t":"Two Stars","x":"Did not do anything for me.","d":"2018-02","h":0,"v":true},"AB0290706":{"r":1,"t":"Wouldn't recommend","x":"Waste of money. It's too much of a Hassel to use because it collapses all the time.","d":"2021-05","h":0,"v":true},"AB0292133":{"r":1,"t":"Too flimsy to do it’s job","x":"It folds with you put any pressure from hair on it. Once hot all negative issues get worse.","d":"2021-10","h":0,"v":true},"AB0293015":{"r":1,"t":"Doesn't fit","x":"I measured my hair dryer before ordering. It doesn't fit. There is no stretch.","d":"2016-06","h":1,"v":true},"AB0294628":{"r":1,"t":"Not happy","x":"Worthless. Not worth the money.","d":"2017-05","h":0,"v":true},"AB0297123":{"r":1,"t":"Not stable","x":"Because it collapses for easy storage and travel, it has no stability. Anytime I try and use it on my hair it collapses and I have to re-extend it. It’s not worth the money nor the hassle in my opinion.","d":"2021-12","h":0,"v":true},"AB0297200":{"r":1,"t":"I do not recommend","x":"They should really sell this with the hair dryer that goes with it. You spend so much time keeping the damn thing on it's really a shame.","d":"2017-03","h":2,"v":true},"AB0297424":{"r":1,"t":"Does not stay on the hair dryer!","x":"This diffuser is awful. The description says it will fit almost any dryer. I tried 3 different hair dryers and my friend tried it on one of hers. It did not fit ANY of them. It would either not go on at all or else slip right off. Do not waste your money on this. I didn't try it when I first got it because I was going to use it for travel. When I discovered it didn't work it was a couple of days past the deadline to return. It's going in the trash.","d":"2022-05","h":0,"v":true},"AB0298539":{"r":2,"t":"For Short hair Only!","x":"The concept is great. It's compact and portable, however when diffusing your hair it collapses on ur due to the weight of hair. So unless you have shoulder length ,thing hair I would not suggest this product.","d":"2019-04","h":0,"v":true},"AB0300860":{"r":1,"t":"Calidad","x":"Llego como defectuoso, tiene como una pieza trasparente que se cae a cada rato","d":"2021-08","h":0,"v":true},"AB0301150":{"r":3,"t":"Doesn’t fit my hairdryer","x":"This did not fit my hairdryer and Its just your normal run of the mill dryers (Conair Pro). I was very disappointed. I was going to send the diffuser back but I had a travel hairdryer and it fit that but not very good. I have to hold it on with my hand. On a positive note it does dry my hair nicely and fast so I kept it.","d":"2018-11","h":0,"v":true},"AB0301728":{"r":2,"t":"Two Stars","x":"Didn't like because it didn't fit my hairdryer returned.","d":"2018-05","h":0,"v":true},"AB0303920":{"r":3,"t":"Great concept, but .....","x":"I was SO excited when I came across this diffuser on Amazon. I’ve used other diffusers in the past, but did not like how much space it required to store it. So this Silicone base product was a new concept to me- a collapsible diffuser, what a great idea! However, the reality was very different. Read below for my experience. Pros: I found this diffuser to be very light weight, because it is collapsible it saves lots of storage space when traveling, the silicone product also stretched a tiny bit to fit around the nozzle, the nozzle measurements were accurate; it fit very snug around my blow dryer (which is a Jilbere by Conair Titanium Tools Dryer, 2000 watts- I LOVE LOVE THIS BLOW DRYER !!). Cons: From my experience the diffuser would often collapse when using it, my curly hair would often get wrapped around the prongs that stick out and would get stuck and pull my hair out even with the slightest touch. Overall, I found this diffuser to be no different than other diffusers; it did not make my hair any better (in terms of volume or frizz) than other diffusers. After a while of attempting to use the diffuser, I was VERY disappointed and annoyed so I returned the product to the seller. I found the product to be poorly constructed (or at least the one that was sent to me was not made well). I would like to give it a 2.5 stars because it delivers on half of what it claims but I don't see an options for this. *** THANK YOU for reading an I hope this review was helpful to you ****","d":"2016-11","h":10,"v":true},"AB0304935":{"r":2,"t":"Not great for long hair.","x":"The idea of this is great, and I’m sure it works great for those with shorter, thinner hair. I have long thick hair and this collapses under the weight of my hair rendering it us mess unless I hold it open, causing me to burn my fingers. I can’t defuse on cold or my hair will never dry.","d":"2022-01","h":0,"v":true},"AB0304980":{"r":1,"t":"Collapsing diffuser save your money","x":"It's okay, it's kind of annoying when your blow drying your hair with a diffuser and it keeps collapsing other than that it does the job I just have to keep adjusting it because it keeps closing on my blow dryer super annoying.","d":"2019-01","h":0,"v":true},"AB0305123":{"r":3,"t":"Fine in a pinch","x":"Easy to pack once collapsed; however, it has a tendency to collapse during use as well, either partially or completely, with very little pressure.","d":"2022-12","h":2,"v":true},"AB0305775":{"r":3,"t":"Three Stars","x":"Received this promptly, but it really doesn't stay on as I had hoped.","d":"2016-09","h":1,"v":true},"AB0307367":{"r":2,"t":"Two Stars","x":"the inner ring fell out after several uses on high. had to keep on low","d":"2018-04","h":0,"v":true},"AB0307600":{"r":3,"t":"once I did it worked good. One of the little plastic things (I think ...","x":"I had a hard time getting this on my blow dryer, once I did it worked good. One of the little plastic things (I think it's for keeping it directly off your scalp) was missing. I haven't connected the manufacturer yet, but will do that today.","d":"2017-05","h":0,"v":false},"AB0307601":{"r":2,"t":"Two Stars","x":"This diffuser didn't fix my blow-dryer","d":"2016-07","h":0,"v":true},"AB0307639":{"r":1,"t":"One Star","x":"it broke so fast!!!!","d":"2017-05","h":0,"v":true},"AB0308323":{"r":1,"t":"Does not fit","x":"Does not fit all hair dryers and collapses if your hair hits it","d":"2018-06","h":0,"v":true},"AB0309821":{"r":1,"t":"Useless, at least with the Rusk W8less dryer.","x":"This thing collapses as soon as a single hair touches it. Wish I hadn’t missed my window to return it. Basically going to throw it away :)","d":"2020-09","h":0,"v":true},"AB0311183":{"r":3,"t":"Doesn't work well for travel.","x":"It's difficult to attach to a dryer that technically should fit and many hotel dryers don't fit at all. Defeats the purpose for which I bought it. Won't buy another.","d":"2019-12","h":0,"v":true},"AB0311538":{"r":1,"t":"Did not fit","x":"Did not fit my blow dryer.","d":"2020-08","h":0,"v":true},"AB0311811":{"r":1,"t":"Can't use","x":"This isn't firm enough to use. It collapses if you touch your head.","d":"2018-10","h":0,"v":true},"AB0314112":{"r":3,"t":"It's not that great product. It just slips off from my dryer ...","x":"It's not that great product. It just slips off from my dryer even my head slightly touches it. It takes more time to make the diffuser stay on dryer than actually drying my hair which is frustrating. Wouldn't recommend this product to others.","d":"2016-07","h":1,"v":true},"AB0315504":{"r":3,"t":"Alright I guess","x":"It does the job of drying your hair with minimal heat if you keep your hand on the cool setting and I do notice less frizz with it, but if you have short to medium hair it can be a pain to use and the collapsable element is great if you're packing it to take somewhere but annoying when it collapses while you are trying to dry your hair. For the price it's probably about as good as you're going to get, but I would personally spend a little more on a more efficient diffuser.","d":"2017-11","h":6,"v":true},"AB0315731":{"r":2,"t":"Not a fan","x":"My problem with this item was that it collapses while I’m doing my hair. It’s nice for travel since it collapses but it continue to do it when you try to diffuse your hair. Not strong enough.","d":"2022-12","h":0,"v":true},"AB0319101":{"r":1,"t":"Don't recommend","x":"I've used this about 6 times when I travel since purchased and it fell apart the 2nd time I used it, and has not fit on ONE hotel hairdryer. Really disappointed. I don't recommend","d":"2021-10","h":0,"v":true},"AB0319639":{"r":3,"t":"Flimsy","x":"Flimsy, collapsed or falls to the side a lot. Annoying.","d":"2018-09","h":0,"v":true},"AB0320955":{"r":3,"t":"Good for travel but not especially sturdy","x":"This diffuser is lightweight and only 1.75\" tall when collapsed. And the part that slips over the dryer nozzle stretches ever-so-slightly to accommodate my Conair Vagabond, which has a non-tapering barrel and 2\" mouth. I don't mind that half the vents in little circular piece (in the center of the \"bell\") are blocked by plastic; it's a minor flaw. But it gets annoying when the diffuser keeps collapsing, partially or fully, with little pressure when I'm drying my hair. Despite the collapse issue, I bought a second diffuser about a year ago to use at home. It was better than the bulky plastic \"universal\" one that kept falling off my full-size dryer. Since then, 5 of the 6 larger nubs have broken - the bullet-shaped caps came loose and fell off. I just bought a replacement - but not by The Curly Co.","d":"2017-07","h":18,"v":true},"AB0322018":{"r":1,"t":"One Star","x":"This diffuser has no \"back bone\". It continues to fold onto itself when used. Returned.","d":"2018-02","h":1,"v":true},"AB0324347":{"r":1,"t":"Collapses will using and super low quality","x":"Very flimsy. This collapses while using. It also falls off while using it.","d":"2018-11","h":0,"v":true},"AB0327689":{"r":1,"t":"Flimsy","x":"Every single time I use this diffuser it would collapse.","d":"2020-03","h":0,"v":true},"AB0328228":{"r":2,"t":"Two Stars","x":"Collapses very easily...not thrilled with it!","d":"2016-09","h":0,"v":true},"AB0328308":{"r":3,"t":"Its okay","x":"It's really flimsy. It collapses even when you barely touch it. Its good for what its supposed to do but I was hoping for a more sturdy diffuser.","d":"2017-07","h":0,"v":true},"AB0328830":{"r":3,"t":"Three Stars","x":"I like that it is collapsible, but it is very difficult to get on hairdryer nozzle.","d":"2016-07","h":1,"v":true},"AB0329116":{"r":2,"t":"😬","x":"Ordered it for traveling but during diffusing drier sucked my hair in.","d":"2022-09","h":0,"v":true},"AB0330664":{"r":3,"t":"Didn’t fit hotel dryer","x":"[[VIDEOID:26e2adde713a7e553c199496ac80e79a]] Worked great on my dryer at home, but unfortunately didn’t fit over hotel dryer. Was too small. Love that it’s collapsible and comes with little drawstring bag","d":"2022-04","h":3,"v":true},"AB0332717":{"r":1,"t":"Not as advertised","x":"In the description of this product the seller describes it as being six and a half inches in diameter. When it arrived it didn't look that big to me so I measured it and it was just a little over 5 inches in diameter. I returned the product.","d":"2018-01","h":0,"v":true},"AB0334260":{"r":2,"t":"Did not fit my hairdryer","x":"No matter how much I struggled, I could not get it to fit on my [Revlon 1875 Ionic] hairdryer, so I had to return it.","d":"2016-06","h":2,"v":true},"AB0337667":{"r":1,"t":"Don’t waste your money","x":"Collapses the entire time you use it! I have thin, light weight hair and it still collapsed when I used it.","d":"2018-07","h":0,"v":true},"AB0338753":{"r":1,"t":"Too big. Didn't stay extended.","x":"This was simply too unwieldy and large for my purposes. The folding design is convenient but it comes at a price: constantly readjusting it because it collapses on itself while you're using it. I can see it being useful for some people (and worth the trouble), but it's not for me. To be clear, this product came exactly as described and is of good quality, it just has some minor flaws I can't deal with.","d":"2016-09","h":3,"v":true},"AB0339149":{"r":2,"t":"Two Stars","x":"The gray rubber pieces fall off easily","d":"2018-06","h":0,"v":true},"AB0339682":{"r":2,"t":"Great concept but choose a different brand","x":"Worked great for about a month, then the plastic piece inside broke and rattled around for awhile. I stopped using it . I think that piece is so cheaply made And wasn’t buy to last. Maybe a different brand has one that’s better for long term?","d":"2019-04","h":0,"v":true},"AB0340350":{"r":1,"t":"Doesn't fit T3 hair dryer","x":"This does not fit the t3 featherweight hair dryer so I had to return it. The nozzle of my hairdryer seems like an average one, not too big or small but for some reason it just didn't fit. Shipping was fast and returning it was easy.","d":"2017-08","h":0,"v":true},"AB0346453":{"r":1,"t":"May not fit all sizes","x":"Did not fit the hair dryer it would go on but then when you turn on the dryer it would fall off. Wish there was a way to make it tighter","d":"2018-07","h":0,"v":true},"AB0347812":{"r":1,"t":"Useless","x":"I couldn't use this since it didn't fit my hair dryer.","d":"2020-01","h":0,"v":true},"AB0349070":{"r":1,"t":"Too heavy!","x":"Too heavy! Collapses real easy.","d":"2016-08","h":1,"v":true},"AB0349200":{"r":3,"t":"Diffuser","x":"It's perfect for traveling, but does collapse in use also, so the hairstyling is not as good as with a traditional diffuser.","d":"2017-08","h":1,"v":true},"AB0349480":{"r":1,"t":"Bad product","x":"Pretty garbage product honestly. This item has no stability and does not stay on my blow dryer. It keeps collapsing during use. Do not buy!","d":"2016-09","h":1,"v":true},"AB0350528":{"r":1,"t":"Meh.","x":"It does not curve as well as expected to the head while drying.","d":"2019-12","h":0,"v":true},"AB0351164":{"r":3,"t":"Good Luck Finding Hairdryer That Fits !","x":"The diffuser works fine and indeed gives hair volume. I love that the diffuser is able to collapse, although you have to be careful not to put too much pressure on it because it seems to collapse while in use. Unfortunately I really could not enjoy the product as much as I wanted to because the whole reason that I bought this product is so that I can travel with it. Good luck finding a hairdryer that fits. I went to 10 different hotels (including cruise lines) and only twice it fit the so called standard hairdryers. I was so bummed, basically brought it with me for nothing. Yes you could just hold the diffuser against the nozzle, but that really does not do it for me. So if you are like me and travel a lot, perhaps this is not the one.","d":"2016-12","h":2,"v":true},"AB0351632":{"r":2,"t":"Not good for heavy hair","x":"The defuser looked just like the picture, that's why I gave it two stars. But, when I tried to use it, it just kept collapsing. So I had to return it. It was a great idea travel, if they can redesign it with something to keep it from collapsing when in use.","d":"2019-03","h":0,"v":true},"AB0352566":{"r":1,"t":"Cheap quality","x":"Fell apart on first use. Very disappointed.","d":"2020-04","h":0,"v":true},"AB0353537":{"r":3,"t":"its ok.","x":"Its ok, it doesn't get into my hair the way my other diffusers did, but its ok.","d":"2017-01","h":0,"v":true},"AB0355453":{"r":1,"t":"don't waste your money","x":"When it heats up the rubber gets soft and pliable and it either falls off my hair dyer, or collapses. Ughh.. don't waste your money.","d":"2017-07","h":1,"v":true},"AB0356395":{"r":1,"t":"Disappointed. Completely fell a part!!!","x":"I thought this was a smart idea and loved the idea of a universal diffuser, but for one, it wasn’t quite strong enough for the weight of my hair and collapsed while I was using it. I started having to hold it out. But then when I pulled it off a hotel blow dryer, the attachment ring tore clean off. I used it still by holding it on the blow dryer because I was traveling and didn’t have another option, but then the plastic diffuser part came out. It wasn’t glued or attached well at all.","d":"2021-03","h":0,"v":true},"AB0356912":{"r":1,"t":"It did not fit any of the hair dryers that ...","x":"It did not fit any of the hair dryers that I have. I bought it to take with me on vacation, and it did not fit the hotel hair dryers either.","d":"2017-11","h":0,"v":true},"AB0357533":{"r":2,"t":"Barley okay product for 2c/3a hair","x":"This diffused fit onto my pink Revlon hair dryer and that pretty much where the positive ends. It collapses whenever I put my hair in it and it also is not deep enough to really \"hold\" hair. I will not be returning it but I am sure their are better options out there.","d":"2018-02","h":0,"v":true},"AB0358213":{"r":3,"t":"Doesn’t fit","x":"It’s doesn’t fit! It’s suppose to fit all blow dryers, but it’s too small! I’m so disappointed!","d":"2018-01","h":0,"v":true},"AB0358241":{"r":2,"t":"Too small","x":"It did not fit my average blowdryer.","d":"2016-08","h":1,"v":true},"AB0359139":{"r":2,"t":"Does not fit 2.25\" blow dryers.","x":"Does not fit 2.25\" blow dryers. silicone does not stretch enough.","d":"2018-02","h":0,"v":true},"AB0359981":{"r":1,"t":"Trash.","x":"This is terrible- it collapses very easily while your drying your hair. Its so flimsy that its not very effective for diffusing. Get a solid plastic one- this is trash.","d":"2021-02","h":0,"v":true},"AB0360237":{"r":1,"t":"Horrible","x":"Collapses right away when in use. Pointless. Dont waste your money. Does not flex to fit nozzle is not stretchy","d":"2020-03","h":0,"v":true},"AB0364550":{"r":1,"t":"Collapses too easily","x":"I wanted to love this, but had to return it because it collapses VERY easily when you're trying to use it :(","d":"2016-06","h":1,"v":true},"AB0366763":{"r":1,"t":"Original and reorder both arrived broke","x":"The first one I ordered was broken so I ordered a replacement. Surprise! Replacement arrived broke as well. This thing might work great, but I'll never know.","d":"2019-04","h":0,"v":true},"AB0366971":{"r":3,"t":"Just Okay","x":"Meh. It works well enough I guess. Seems cheaply built. Several of the plastic pieces fall out regularly and my wife has to put them back in. It does the job though.","d":"2016-06","h":2,"v":true},"AB0368043":{"r":3,"t":"It's fine.","x":"It's okay, not as universal of a fit as it would like. The collapsible nature/squishiness of the diffuser makes it extremely difficult to get on my hair dryer. It's stays on.","d":"2016-04","h":2,"v":true},"AB0368654":{"r":1,"t":"Lasted two weeks. While traveling I tried to place ...","x":"Lasted two weeks. While traveling I tried to place it on the blowdryer from the hotel. It was a tight fit and all of the sudden it split.","d":"2017-07","h":1,"v":true},"AB0368857":{"r":3,"t":"Not great for long thick hair","x":"I initially purchased this because it was silicone and because it is collapsible. It’s lightweight and it doesn’t take up a lot of room like some other diffusers do. The only thing I don’t like is that it collapses when I’m using it on myself. So I constantly have to pop it back open. I have long thick wavy hair so maybe if your hair is on the less dense side it won’t happen but it happens every time I use it and it’s pretty annoying.","d":"2021-10","h":0,"v":true},"AB0371468":{"r":2,"t":"Two Stars","x":"Does not work for me，was too hot！Sent it back！","d":"2016-06","h":1,"v":true},"AB0372287":{"r":2,"t":"I have thick curly hair and this diffuser collapses under ...","x":"I have thick curly hair and this diffuser collapses under the weight of my wet hair. It was extremely disappointing. It also does not fit my dryer very well and pops off. So berween fighting to keep it on and fully extended , it almost unusable.","d":"2017-04","h":1,"v":true},"AB0372947":{"r":3,"t":"Does NOT fit 2.25” barrels","x":"Does NOT fit 2.25” barrels- ordered this because it said it had “stretch”, not true. Will use for my travel dryer but had to order another one for my main dryer.","d":"2018-01","h":0,"v":true},"AB0373818":{"r":3,"t":"Pretty Good","x":"It works pretty well but it isn’t compatible with a lot of hair dryers. It’s kinda hard to put into the hairdryer. I would most likely bring this to travel instead of having it for everyday use. The material is very nice. The plastic is thick so it isn’t cheaply made. Overall, pretty average product.","d":"2021-06","h":0,"v":true},"AB0374056":{"r":3,"t":"Great way to dry hair without drying out hair.","x":"It dries hair better than my other non-collapsable diffusers. It dries my hair quicker and without drying out my hair, so my hair still looks moisturizer. The only thing is that I feel it collapses too easily. The slightest touch of my head and the entire thing flattens. I don't think that's normal with this type of diffuser. Maybe mine just wasn't part of the lucky manufactured batch.","d":"2017-06","h":0,"v":true},"AB0380241":{"r":1,"t":"Too small","x":"Doesn't fit most blow dryers. Bought it and now can't use it. Frustrated.","d":"2016-12","h":1,"v":true},"AB0380465":{"r":3,"t":"Didn't fit my hair dryer!","x":"A great idea if it fit my hair dryer!!","d":"2022-12","h":0,"v":true},"AB0381593":{"r":1,"t":"it did not fit my dryer even thou it says ...","x":"it did not fit my dryer even thou it says its MOST dryers, not sure what to do with it, as i tossed the bags.","d":"2018-06","h":0,"v":true},"AB0383715":{"r":1,"t":"Didn't fit my dryer","x":"Didn't fit my dryer so I can't use it.","d":"2016-05","h":0,"v":true},"AB0385381":{"r":1,"t":"collapses, even when you don't want it to","x":"This is hard to use because it collapses when in use","d":"2021-02","h":0,"v":true},"AB0386867":{"r":1,"t":"Una pérdida de dinero.","x":"Lo compré pensando que era conveniente para cargar en la maleta de viaje pero no se sostiene, se cierra y se sale del secador de pelo. Lo tiré a la basura.","d":"2022-07","h":0,"v":true},"AB0387039":{"r":1,"t":"What a DISAPPOINTMENT","x":"What a waste of money. When I first used it the piece in the middle thing was burnt down a little bit from my dryer being hot. So if you have a hot blow dryer DO NOT get it. Second day I used it , the piece in the middle was melted more. Needless to say I threw this out because it became to melted inside to use and was not staying on the dryer. It did make my hair culry though but I have naturally curly hair.","d":"2016-08","h":22,"v":true},"AB0389104":{"r":2,"t":"Too difficult to attach","x":"I have a 2\" nozzle on my dryer and it was very difficult to get the attachment on. My hair had nearly dried on it's own by the time I got it attached. Once it was attached the telescoping part was very flimsy and did not stay extended. Had to return.","d":"2017-11","h":0,"v":true},"AB0389479":{"r":1,"t":"One Star","x":"It kept collapsing when using it","d":"2018-04","h":0,"v":true},"AB0390214":{"r":2,"t":"Collapses when diffusing","x":"I like the concept of this diffuser but it drives crazy that is doesn’t hold its form when drying. It is constantly collapsing on me.","d":"2021-02","h":0,"v":true},"AB0390935":{"r":3,"t":"It's good but collapses.","x":"It works well but it keep collapsing while I'm diffusing my hair. I'm not too happy with that part. It does the job well though.","d":"2016-02","h":0,"v":true},"AB0391593":{"r":1,"t":"Doesn't fit and no booklet","x":"Doesn't fit my Conair 1875 hair drier (the diffuser is too small, this is a normal sized drier that was purchased at Walgreens a few years ago) and did NOT come with the little tips and tricks booklet it was supposed to come with. Double fail.","d":"2016-03","h":1,"v":false},"AB0392061":{"r":2,"t":"Cons outweigh pros","x":"Cons: Collapses and falls off when using Pro: Good for small storage space","d":"2017-02","h":0,"v":true},"AB0393979":{"r":2,"t":"Completely faulty.","x":"I was SO excited for this diffuser. I bought because I was going on a 2 week trip throughout Europe and because I was hopping countries, I needed to pack light.. but my curly hair needed to also be tamed, haha. I was so mad when it came in.. it did not fit my travel sized hair dryer!!!! UGH. So, I tried to squeeze it on my regular hair dryer...... didn't fit. Kept thinking I must not be putting this on correctly, because they advertise it fits on most hair dryers! Grabbed my roommate.. she tried. She couldn't fit them either. The end of the diffuser is a little stretchy, but not stretchy to fit either of my hair dryers.. Determined, we tried my roommates hair dryer as well.. IT DIDNT FIT. This is terrible. Well, I finally got it to fit on my travel size because I ended up putting one of the attachments on the hair dryer; the one where it's like a flathead. Once I did that, the diffuser awkwardly fit over it, but at times will slip off because it's not a circle shape it's stuck on to. Once I added the attachment, the diffuser did end up working pretty decently. So, I took it all to Europe. Another con to this, one of the six nodules on the face of the diffuser fell off! UGH! Maybe because the air flowing through was too hot and it warped because it's plastic? I'm not sure. I have no idea where it went though, so that sucks. and then when I took the diffuser off the hairdryer, there's a little plastic cap on the inside center of the diffuser that popped off as well! ...This seems to either be a faulty diffuser that I was sent, or these are actually just insanely cheaply made. I do like how the silicone diffuses my curls... but because pped second time I used it. Waste of money","d":"2017-05","h":0,"v":true},"AB0612146":{"r":1,"t":"Not really “universal”.","x":"Before I even tried to use this, the front plate fell out. I was able to get it back inside the rim but it’s not secure. I took it on vacation and it absolutely would not fit the dryer which was completely normal sized. Would not recommend this product.","d":"2022-01","h":0,"v":true},"AB0612151":{"r":2,"t":"Not “universal” enough?","x":"I work in a huge health club where the locker room has a ton of different hair dryers available to use. I bought this hoping I could use it on any of the different model dryers. This diffuser would not fit over a single nozzle of the dryers. Out of desperation, I ended up cutting the part where the nozzle would go it (since it’s rubber it also tore a little) and I got it to fit. By destroying it. It works okay now but my suggestion is finding a stretchier rubber material that would actually fit over standard sized hair dryers.","d":"2022-11","h":1,"v":true},"AB0613740":{"r":3,"t":"Three Stars","x":"Works but isn't what I expected.","d":"2017-07","h":0,"v":true},"AB0613978":{"r":3,"t":"Ok product","x":"Barely fit my blow dryer! I was able to stretch it out to pull it on but now I can't take it off because I know it will either break or rip apart, or I will never be able to get it back on! So make sure you measure before buying because it maybe the wrong size! Also, not salon quality product... should have spent more money and just got a better one!","d":"2017-01","h":2,"v":true},"AB0617218":{"r":3,"t":"its ok","x":"The top fell out","d":"2020-08","h":0,"v":true},"AB0617373":{"r":2,"t":"No","x":"It does what it’s supposed to but after just one use it warped my Revlon ceramic blow dryer that I love so much. The material it’s made of sucks.","d":"2019-08","h":0,"v":true},"AB0617409":{"r":1,"t":"Nothing like what was shown","x":"I received 4 brown (eww) shirts and 2 pink. Nothing like what was shown.","d":"2017-04","h":0,"v":true},"AB0618034":{"r":1,"t":"Dont buy","x":"Melted and didnt even make my hair curly!","d":"2016-02","h":1,"v":true},"AB0618350":{"r":3,"t":"Meh","x":"Collapses very easily. I constantly have to adjust it while in use.","d":"2018-07","h":0,"v":true},"AB0618591":{"r":2,"t":"I really loved this product","x":"I really loved this product... however after having it less than 6 months it stretched out and the diffuser screen always pops out... wished it would have lasted longer.","d":"2017-06","h":0,"v":true},"AB0620981":{"r":1,"t":"Wast of money","x":"I liked this diffuser, but only had for five months and the head of the diffuser came off the body while it was attached to my hair dryer. Super disappointed that it didn’t last long and that there’s no way to fix it.","d":"2018-12","h":0,"v":true},"AB0622707":{"r":1,"t":"Very breakable","x":"Maybe it was the packaging but the little pieces attached to the head piece broke off!","d":"2017-08","h":0,"v":true},"AB0624816":{"r":1,"t":"It worth it!!","x":"It ripped within one use and doesn’t fit every hair dryer.","d":"2021-12","h":0,"v":true},"AB0625972":{"r":1,"t":"Find a different option","x":"Received this item today and was quite disappointed. The item was delivered with two out of the six \"tabs\" broken; therefore, it will not work at all. The item seems to be made poorly and collapsed quite easily. I will be returning it before I can even use it. Find a different diffuser!","d":"2016-07","h":5,"v":true},"AB0627566":{"r":3,"t":"Cheaply made, gets the job done","x":"This product is super cheaply made. Every part that could break off has. I can always put it back together, but not easily. Falls off my hairdryer every time. But it gets the job done. Get what you pay for.","d":"2022-05","h":0,"v":true},"AB0627961":{"r":1,"t":"No go","x":"It did not fit my blow dryer. Had to return it.","d":"2019-12","h":0,"v":true},"AB0628611":{"r":1,"t":"One Star","x":"Didn't fit my blow dryer","d":"2018-06","h":0,"v":true},"AB0629896":{"r":1,"t":"Save your money; don’t buy","x":"The metal diffuser part actually came off. It also constantly collapses when in use. Really bad quality","d":"2018-12","h":0,"v":true},"AB0630568":{"r":1,"t":"Collapses","x":"Hate this diffuser. Hard to use because it collapses. Cannot push it into your hair. Cannot use prongs for lift. DO NOT BUY!","d":"2023-03","h":0,"v":true},"AB0630627":{"r":1,"t":"One Star","x":"Nice concept that the diffuser collapses for travel, BUT it collapses when you use it too. Bad product.","d":"2016-10","h":1,"v":true},"AB0631029":{"r":1,"t":"Cheap product","x":"It worked for a couple months. The part that sticks to the hair dryer broke, so I have to throw it away","d":"2018-08","h":0,"v":true},"AB0633643":{"r":3,"t":"I love the idea of a collapsible diffuser so that I ...","x":"I love the idea of a collapsible diffuser so that I can travel with it. However, when it came to actually using it, it kept collapsing on itself. I like to use a diffuser closer to my head to build more body but it kept folding back up. I managed to use my free hand to hold it but was disappointed in that feature. For future models, maybe a locking device that will hold it open when being used?","d":"2016-09","h":2,"v":true},"AB0633726":{"r":1,"t":"Which I'd returned it...","x":"It collapses when I try to diffuse my curly hair... not worth the money..","d":"2017-12","h":0,"v":true},"AB0635862":{"r":3,"t":"Three Stars","x":"This doesn't fit that well on my hair dryer.","d":"2018-03","h":0,"v":true},"AB0637255":{"r":3,"t":"Good buy","x":"Good quality for price!","d":"2020-02","h":0,"v":true},"AB0640343":{"r":3,"t":"The collapsible quality is nice for staring","x":"This does the job well enough. I'm able to blow dry my hair and keep my curls without blowing them out and puffing up my hair. The collapsible quality is nice for staring, but it isn't sturdy enough when extended and I have to re-extend it often when blowdrying, as it will collapse as I use it.","d":"2017-01","h":0,"v":true},"AB0640418":{"r":2,"t":"Fits my dryer but will NOT stay expanded during use","x":"The pros: fits nicely on my dryer and stays put; compact design is nice for travel The (one big) con: this thing is constantly collapsing during use. I have very thick 3b-c curls, and when I try to get closer to my roots, the weight of my hair pushes the diffuser downwards. This makes it difficult to get volume even when using clips at my roots. I wanted to love this product but this flaw makes it hard to use.","d":"2018-05","h":0,"v":true},"AB0643935":{"r":1,"t":"One Star","x":"As soon as I put this on my blow dryer the rubber began to split!!!","d":"2017-01","h":0,"v":true},"AB0646679":{"r":2,"t":"Ehhh.","x":"One of the little pieces broke off while I was using it on my hair.","d":"2017-04","h":0,"v":true},"AB0649080":{"r":1,"t":"It's too bad, since it got such good reviews","x":"It didn't fit two of the hairdryers that I tried with it. It's too bad, since it got such good reviews.","d":"2016-06","h":1,"v":true},"AB0650296":{"r":1,"t":"I wanted to love this but I feel like I got a defected ...","x":"Arrived with two of those little white knobs missing. Then when I unwrapped and carried to my bathroom another fell off. I wanted to love this but I feel like I got a defected one :/","d":"2018-05","h":0,"v":true},"AB0650934":{"r":1,"t":"Not universal for as described","x":"This product is not universal. I have 4 hairdryers at home and it did not fit a any of them.","d":"2020-01","h":0,"v":true},"AB0651158":{"r":1,"t":"One Star","x":"Does nothing for your hair. You might as well let it air dry. Does not hold","d":"2016-06","h":0,"v":true},"AB0651746":{"r":1,"t":"Doesn't fit","x":"hard to fit on different blow dryers","d":"2018-10","h":0,"v":true},"AB0652659":{"r":2,"t":"Two Stars","x":"Does not fit my regular hair dryer or my travel hair dryer.","d":"2017-11","h":0,"v":true},"AB0654961":{"r":1,"t":"One Star","x":"Very bad product!!! Just took out the package and the little nozzles keep coming out.","d":"2017-07","h":0,"v":true},"AB0655639":{"r":3,"t":"I ordered this product because it was recommended by a curly hair blogger that I follow","x":"I ordered this product because it was recommended by a curly hair blogger that I follow. When it arrived the six little pieces on it were loose and frayed. Very disappointing. However, I figured I would try it before returning it. I’ve only used it once so far and I love how my hair turned out! So far those little pieces are still intact, they just look rugged. 3 stars only because it arrive defective.","d":"2018-01","h":0,"v":true},"AB0656006":{"r":3,"t":"Does not fit my hair dryer","x":"I have a very common revlon hair dryer and it does not fit it, so either I buy a new hair dryer or I send this back and by a different diffuser.....pretty bummed....","d":"2019-12","h":0,"v":true},"AB0656074":{"r":1,"t":"Do not buy!","x":"Only a month and the neck of the attachment separated from the diffuser","d":"2017-12","h":0,"v":true},"AB0657439":{"r":1,"t":"Not really usable","x":"I had never bought a universal diffuser before. This came off my dryer every 2 seconds if I moved the dryer at all. It kept collapsing while in use. Just not what I had hoped for.","d":"2022-05","h":0,"v":true},"AB0659660":{"r":3,"t":"Perfect for travel, not the best for home","x":"This is perfect for travel. On the down side, I think its too flimsy for home because it kept falling off the hair dryer even though it fit. I am using it on a FHI dryer from Target.","d":"2021-03","h":0,"v":true},"AB0661666":{"r":2,"t":"Good in theory","x":"I have wavy hair that's pretty heavy. This collapsed under the weight of my hair. Drying my scalp is pretty difficult. I love the collapsible part in theory but it's helpful with this model.","d":"2018-04","h":0,"v":true},"AB0662557":{"r":1,"t":"Flimsy. Did not stand up well when blow drying.","x":"Was not a fan of this product. It did fit my hair dryer very nicely but it was very flimsy. Since the collapsible part was some kind of rubber material it did not hold up very well when I would blow dry my hair. I liked the idea but not the way it was made","d":"2018-01","h":0,"v":true},"AB0662679":{"r":3,"t":"I had to glue them back on with super glue. HOWEVER","x":"Was delivered with broken pieces, very very cheap. I had to glue them back on with super glue. HOWEVER, once I repaired the item myself, it DOES work and diffuses nicely. Other issue is I bought a Curly Co hair dryer to go with it and the Curly Co diffuser does not fit onto the Curly Co hair dryer which does not make much sense to me. Therefore I have to strech the rubber part of the diffuser to fit onto the hair dryer (its a pain).","d":"2016-10","h":2,"v":true},"AB0663157":{"r":3,"t":"Ripped after a Year","x":"Was enjoying this product- especially for travel. It was recommended to me by my hair stylist. It does collapse on you a bit while drying but the ability to store it easily made it worth it to me. I’ve probably used it about 50 times. Today, I smelled a burning smell and looked down and the whole base had ripped. I’m pretty disappointed because this curly girl had to leave the house with a wet head and I’m just not sure if I should get another one…","d":"2022-10","h":9,"v":true},"AB0665734":{"r":2,"t":"Collapses easily","x":"The diffuser works well, but I just wish it didn't collapse so easily. I barely have to touch it for it to close in on itself.","d":"2016-09","h":1,"v":true},"AB0666622":{"r":3,"t":"Very eh","x":"I bought this after deciding to go on a curly hair journey. Most of the reviews are incredibly accurate. The collapsible feature would be great for traveling and trying to condense space, but it is a struggle to attach to my blow dryer EVERY time I use it. While using it, it often collapses and doesn’t feel like there’s a lot of air coming from it. It gets the job done but also takes me 30 minutes to diffuse my entire head. I’m looking into other diffusers, or a new hair dryer altogether.","d":"2020-09","h":0,"v":true},"AB0668879":{"r":1,"t":"Would not recommend","x":"This product did not fit any of the hotel hair dryers as advertised it would","d":"2020-10","h":1,"v":true},"AB0669466":{"r":2,"t":"Two Stars","x":"I never got to use it...I thought it would fit my hair dryer, but it didn’t and broke 🤦🏽‍♀️","d":"2017-11","h":0,"v":true},"AB0676744":{"r":1,"t":"Dont worth it","x":"Collapses very easily when you're using it making it difficult to use I would recommend using a non collapsible diffuser","d":"2016-10","h":1,"v":true},"AB0677810":{"r":1,"t":"It did not fit my dryer. I measured my ...","x":"It did not fit my dryer. I measured my dryer before I bought the diffuser and it is 2 1/2 inches. The opening of your dryer would need to be smaller than that to fit.","d":"2016-04","h":5,"v":true},"AB0680204":{"r":3,"t":"Does not fit most hair dryers","x":"I took this on a trip and visited 4 hotels and it did not fit any hair dryer. Concept is good but the opening to attach to hairdryers is way too small for the average hair dryer.","d":"2023-08","h":0,"v":true},"AB0682733":{"r":1,"t":"One Star","x":"Item fell completely apart and now it’s too late to return, after a few months.","d":"2018-04","h":0,"v":true},"AB0687672":{"r":1,"t":"Doesn’t fit","x":"I thought it would be good, but didn’t fit on any of the 3 hair dryers I tried at different hotels while traveling recently.","d":"2020-02","h":0,"v":true},"AB0688968":{"r":3,"t":"Too snug","x":"I haven't used it, yet, but that's likely because it doesn't fit on my blow dryer, properly, and I struggled for TWENTY MINUTES to even get it on halfway. I think the stretch could be a bit better for fitting it over the mouthpiece of a blow dryer.","d":"2017-06","h":0,"v":true},"AB0693475":{"r":1,"t":"Waste of money","x":"Useless. Doesn’t fit a single hairdryer so far. And like someone else said, it’s too flimsy to be useful.","d":"2021-09","h":0,"v":true},"AB0693949":{"r":3,"t":"Didn’t fit the hotel hairdryer","x":"I wanted to like this diffuser but it was too small for the hotel’s hairdryer so I didn’t get to use it. It’s lightweight and compact for what it is, so there’s that.","d":"2021-08","h":0,"v":true},"AB0694045":{"r":3,"t":"so, so","x":"because it is a light rubber, it collapses easily perhaps I need to pull harder to make it stay in place.","d":"2017-04","h":0,"v":true},"AB0700212":{"r":3,"t":"Three Stars","x":"It was great for the first few months and then it melted to my blowdryer.","d":"2017-07","h":0,"v":true}}};
</script>
<script>
(function(){
const D = DATA, T = D.topics;
const S = D.sents.map(a=>({id:a[0],rid:a[1],no:a[2],t:a[3],r:a[4],en:a[5],ko:a[6]}));
const R = D.reviews;
const byRev = {};
S.forEach(s=>{(byRev[s.rid]=byRev[s.rid]||[]).push(s)});
Object.values(byRev).forEach(a=>a.sort((x,y)=>x.no-y.no));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n=>n.toLocaleString('ko-KR');
const pct = (a,b)=>b?Math.round(a/b*100):0;
const PAGE = 10, SPAGE = 20;
const state = {page:0, rate:0, lp:1, q:'', sRate:0, sTopic:-1, sp:1};

/* ---------- helpers ---------- */
function hl(text, terms){
  if(!terms.length) return esc(text);
  const re = new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return text.split(re).map((p,i)=> i%2 ? '<mark>'+esc(p)+'</mark>' : esc(p)).join('');
}
function distHTML(arr){
  const tot = arr.reduce((a,b)=>a+b,0)||1;
  return '<div class="dist">'+[1,2,3].map((r,i)=>
    `<div class="dist-row"><span class="stars">★${r}</span><div class="bar"><i style="width:${arr[i]/tot*100}%;background:var(--r${r})"></i></div><span class="num">${fmt(arr[i])}건 · ${pct(arr[i],tot)}%</span></div>`).join('')+'</div>';
}
function miniBar(arr){
  const tot = arr.reduce((a,b)=>a+b,0)||1;
  return '<div class="minibar" title="★1 '+arr[0]+' / ★2 '+arr[1]+' / ★3 '+arr[2]+'">'+arr.map((v,i)=>`<i style="width:${v/tot*100}%;background:var(--r${i+1})"></i>`).join('')+'</div>';
}
function sentCard(s, terms, showTopic){
  const tp = T[s.t];
  return `<article class="sent" data-sid="${esc(s.id)}">
    <div class="sent-h" role="button" tabindex="0" aria-expanded="false">
      <span class="badge b${s.r}">★${s.r}</span>
      <div><div class="en" lang="en">${hl(s.en,terms)}</div><div class="ko">${hl(s.ko,terms)}</div></div>
      <div class="meta">${esc(s.rid)} · ${s.no}번째 문장${showTopic?`<span class="tp" data-goto="${s.t+1}">${esc(tp.name)}</span>`:''}</div>
    </div>
    <div class="detail"></div>
  </article>`;
}
function fillDetail(card){
  const d = card.querySelector('.detail');
  if(d.dataset.done) return;
  const sid = card.dataset.sid, cur = S.find(x=>x.id===sid), rv = R[cur.rid], list = byRev[cur.rid];
  d.dataset.done = 1;
  d.innerHTML = `<h4>리뷰 전체 · ${esc(cur.rid)}</h4>
    <div class="dtitle" lang="en">${esc(rv.t||'(제목 없음)')}</div>
    <div class="dmeta">★${rv.r} · ${esc(rv.d)} · 도움이 돼요 ${rv.h} · ${rv.v?'구매 확인':'구매 미확인'} · 문장 ${list.length}개</div>
    <div class="full" lang="en">${esc(rv.x)}</div>
    <h4>문장별 원문과 한국어 풀이 <span class="note">(주제 배정 포함)</span></h4>`+
    list.map(x=>`<div class="rs ${x.id===sid?'cur':''}"><div class="en" lang="en">${esc(x.en)}<span class="tag" data-goto="${x.t+1}">${esc(T[x.t].name)}</span></div><div class="ko">${esc(x.ko)}</div></div>`).join('')+
    `<p class="note">한국어 풀이는 문장 분리 후 문장 단위로 번역한 것이라, 접속사 일부가 빠져 있을 수 있습니다.</p>`;
}
function pager(total, cur, size, key){
  const n = Math.ceil(total/size); if(n<=1) return '';
  const pages = []; const add = p=>{ if(!pages.includes(p)&&p>=1&&p<=n) pages.push(p) };
  add(1); add(2); for(let p=cur-2;p<=cur+2;p++) add(p); add(n-1); add(n); pages.sort((a,b)=>a-b);
  let h = `<button data-pg="${key}:${cur-1}" ${cur<=1?'disabled':''}>‹</button>`, prev=0;
  pages.forEach(p=>{ if(prev&&p-prev>1) h+='<span class="gap">…</span>'; h+=`<button class="${p===cur?'on':''}" data-pg="${key}:${p}">${p}</button>`; prev=p });
  h += `<button data-pg="${key}:${cur+1}" ${cur>=n?'disabled':''}>›</button>`;
  return `<div class="pager" aria-label="페이지">${h}</div>`;
}

/* ---------- nav ---------- */
function renderNav(){
  const items = [`<button class="nav-item ${state.page===0&&!state.q?'on':''}" data-goto="0"><span class="no">★</span><span class="nm">전체 개요</span><span class="ct"></span></button>`]
    .concat(T.map((t,i)=>`<button class="nav-item ${state.page===i+1&&!state.q?'on':''}" data-goto="${i+1}"><span class="no">${i+1}</span><span class="nm">${esc(t.name)}</span><span class="ct">${fmt(t.n_sent)}</span></button>`));
  $('#side').innerHTML = '<h2>주제 (문장 수)</h2>'+items.join('');
}
function jumpHTML(){
  return '<select class="jump" id="jump" aria-label="주제 이동"><option value="0">전체 개요</option>'+T.map((t,i)=>`<option value="${i+1}" ${state.page===i+1&&!state.q?'selected':''}>${i+1}. ${esc(t.name)} (${fmt(t.n_sent)})</option>`).join('')+'</select>';
}

/* ---------- pages ---------- */
function overview(){
  const o = D.overall, maxS = Math.max(...T.map(t=>t.n_sent));
  const avg = (o.rev_rating[0]*1+o.rev_rating[1]*2+o.rev_rating[2]*3)/o.n_rev;
  return `${jumpHTML()}
  <h1>리뷰를 주제로 나눠 보면</h1>
  <p class="lead">Amazon의 헤어 디퓨저 한 제품에 달린 1~3점 리뷰 ${fmt(o.n_rev)}건을 문장 ${fmt(o.n_sent)}개로 나누고, 의미가 비슷한 문장끼리 묶어 ${o.n_topics}개 주제와 미분류로 정리했습니다.</p>
  <div class="tiles">
    <div class="tile"><div class="k">분석 리뷰</div><div class="v">${fmt(o.n_rev)}</div><div class="s">평균 별점 ${avg.toFixed(2)}</div></div>
    <div class="tile"><div class="k">문장</div><div class="v">${fmt(o.n_sent)}</div><div class="s">리뷰당 평균 ${(o.n_sent/o.n_rev).toFixed(1)}개</div></div>
    <div class="tile"><div class="k">주제</div><div class="v">${o.n_topics}</div><div class="s">+ 미분류 ${o.n_out}문장</div></div>
  </div>
  <div class="card"><h3>리뷰 별점 분포</h3>${distHTML(o.rev_rating)}</div>
  <div class="card"><h3>주제 한눈에 보기 <span class="note">— 행을 누르면 해당 주제 페이지로 이동합니다</span></h3>
    <div style="overflow:auto"><table class="t"><thead><tr><th>#</th><th>주제</th><th>문장 수</th><th style="min-width:110px">비중</th><th>리뷰 수</th><th>평균 별점</th><th style="min-width:100px">별점 분포</th></tr></thead><tbody>`+
    T.map((t,i)=>`<tr class="row" data-goto="${i+1}"><td>${i+1}</td><td><b>${esc(t.name)}</b></td><td class="num" style="text-align:left">${fmt(t.n_sent)}</td><td><div class="share" style="width:${t.n_sent/maxS*100}%"></div></td><td class="num" style="text-align:left">${fmt(t.n_rev)}</td><td class="num" style="text-align:left">${t.avg.toFixed(2)}</td><td>${miniBar(t.rev_rating)}</td></tr>`).join('')+
    `</tbody></table></div>
    <p class="note" style="margin:10px 0 0">리뷰 수는 그 주제에 문장이 하나라도 들어 있는 리뷰의 수입니다. 한 리뷰가 여러 주제에 걸치므로 합이 ${fmt(o.n_rev)}보다 큽니다.</p></div>
  <div class="card"><h3>분석 방법과 읽을 때 주의할 점</h3><ul class="note">
    <li><b>데이터</b>: Amazon Reviews 2023 All_Beauty, 상품 하나(ASIN B019GBG0IE). 중복·HTML 태그·특수문자를 정리한 뒤 별점 1~3점만 사용했습니다.</li>
    <li><b>문장 분리</b>: 마침표 기준으로 나눈 뒤 and/but/so 등 접속사로 이어진 절을 다시 나누고 이모지를 제거했습니다. 접속사는 분리 지점에서 삭제됩니다.</li>
    <li><b>군집화</b>: MiniLM 다국어 임베딩 → UMAP(이웃 수 5) → HDBSCAN(최소 군집 크기 40). 모델 2종·이웃 수 5종·군집 크기 5종, 총 50개 조합을 실루엣·일관성·다양성·미분류 비율과 시드 안정성으로 비교해 골랐습니다.</li>
    <li><b>한국어 풀이</b>는 Claude가 문장 단위로 번역한 것으로 의역이 있을 수 있고, 스페인어 문장은 "(스페인어)"로 표시했습니다. 리뷰 제목은 번역하지 않았습니다.</li>
    <li>군집 이름은 대표 문장을 보고 붙인 해석이며 알고리즘이 정한 것이 아닙니다. 특히 1번 주제는 호환성과 접힘 불만이 섞인 큰 군집입니다.</li>
    <li>이 분석은 하나의 상품, 1~3점 리뷰만을 대상으로 하므로 전체 고객 의견을 대표하지 않습니다.</li>
  </ul></div>
  <div class="pn"><span class="empty"></span><button class="next" data-goto="1"><small>다음 주제 ›</small>${esc(T[0].name)}</button></div>`;
}

function topicPage(i){
  const t = T[i-1];
  const all = S.filter(s=>s.t===i-1 && (state.rate===0 || s.r===state.rate));
  const total = all.length, st = (state.lp-1)*PAGE;
  const view = all.slice(st, st+PAGE);
  const prev = i>1 ? T[i-2] : null, next = i<T.length ? T[i] : null;
  return `${jumpHTML()}
  <div class="crumb">주제 ${i} / ${T.length}</div>
  <h1>${esc(t.name)}</h1>
  <p class="lead">${esc(t.desc)}</p>
  <div class="tiles">
    <div class="tile"><div class="k">포함된 리뷰</div><div class="v">${fmt(t.n_rev)}</div><div class="s">전체 ${fmt(D.overall.n_rev)}건 중 ${pct(t.n_rev,D.overall.n_rev)}%</div></div>
    <div class="tile"><div class="k">문장</div><div class="v">${fmt(t.n_sent)}</div><div class="s">전체의 ${pct(t.n_sent,D.overall.n_sent)}%</div></div>
    <div class="tile"><div class="k">평균 별점</div><div class="v">${t.avg.toFixed(2)}</div><div class="s">포함 리뷰 기준</div></div>
  </div>
  <div class="card"><h3>별점 분포 <span class="note">— 이 주제에 문장이 들어 있는 리뷰 기준</span></h3>${distHTML(t.rev_rating)}</div>
  ${t.keywords.length?`<div class="card"><h3>주요 단어</h3><div class="chips">${t.keywords.map(k=>`<button class="chip btn" data-kw="${esc(k)}" title="이 단어로 검색">${esc(k)}</button>`).join('')}</div></div>`:''}
  <div class="card"><h3>${t.id<0?'예시 문장':'대표 문장'} <span class="note">— ${t.id<0?'미분류의 앞쪽 문장 3개(중심 개념이 없어 대표성은 없음)':'주제의 중심에 가장 가까운 문장'}</span></h3><div class="rep">${t.reps.map(r=>`<div class="pair"><div class="en" lang="en">${esc(r.en)}</div><div class="ko">${esc(r.ko)}</div></div>`).join('')}</div></div>
  <div class="ctrl"><h3 style="margin:0">문장 목록</h3><span class="note">${fmt(total)}개 · 문장을 누르면 리뷰 전체가 열립니다</span><span class="grow"></span>
    <div class="seg" role="group" aria-label="별점 필터">${[0,1,2,3].map(r=>`<button class="${state.rate===r?'on':''}" data-rate="${r}">${r?'★'+r:'전체'}</button>`).join('')}</div></div>
  <div id="list">${view.map(s=>sentCard(s,[],false)).join('')||'<div class="empty-msg">조건에 맞는 문장이 없습니다.</div>'}</div>
  ${pager(total,state.lp,PAGE,'lp')}
  <div class="pn">${prev?`<button data-goto="${i-1}"><small>‹ 이전 주제</small>${esc(prev.name)}</button>`:`<button data-goto="0"><small>‹ 처음으로</small>전체 개요</button>`}${next?`<button class="next" data-goto="${i+1}"><small>다음 주제 ›</small>${esc(next.name)}</button>`:'<span class="empty"></span>'}</div>`;
}

function searchPage(){
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const res = S.filter(s=>{
    if(state.sRate && s.r!==state.sRate) return false;
    if(state.sTopic>=0 && s.t!==state.sTopic) return false;
    const hay = (s.en+' '+s.ko+' '+s.rid).toLowerCase();
    return terms.every(w=>hay.includes(w));
  });
  const reviews = new Set(res.map(s=>s.rid)).size;
  const st = (state.sp-1)*SPAGE, view = res.slice(st, st+SPAGE);
  return `<div class="crumb">검색</div>
  <h1>“${esc(state.q)}” 검색 결과</h1>
  <p class="lead">문장 ${fmt(res.length)}개 · 리뷰 ${fmt(reviews)}건 (원문·한국어 풀이·리뷰 번호에서 찾습니다)</p>
  <div class="sr"><label class="note">별점 <select id="sRate"><option value="0">전체</option>${[1,2,3].map(r=>`<option value="${r}" ${state.sRate===r?'selected':''}>★${r}</option>`).join('')}</select></label>
  <label class="note">주제 <select id="sTopic"><option value="-1">전체</option>${T.map((t,i)=>`<option value="${i}" ${state.sTopic===i?'selected':''}>${i+1}. ${esc(t.name)}</option>`).join('')}</select></label></div>
  <div id="list">${view.map(s=>sentCard(s,terms,true)).join('')||'<div class="empty-msg">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>'}</div>
  ${pager(res.length,state.sp,SPAGE,'sp')}`;
}

/* ---------- render ---------- */
function render(keepScroll){
  renderNav();
  $('#main').innerHTML = state.q ? searchPage() : (state.page===0 ? overview() : topicPage(state.page));
  if(!keepScroll) window.scrollTo({top:0});
  const j = $('#jump'); if(j) j.onchange = ()=>go(+j.value);
}
function go(p){ state.q=''; $('#q').value=''; $('#qclear').style.display='none'; state.page=Math.max(0,Math.min(T.length,p)); state.rate=0; state.lp=1; history.replaceState(null,'','#'+state.page); render(); }

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-goto]'); if(g){ e.stopPropagation(); go(+g.dataset.goto); return; }
  const kw = e.target.closest('[data-kw]'); if(kw){ setQuery(kw.dataset.kw); return; }
  const rt = e.target.closest('[data-rate]'); if(rt){ state.rate=+rt.dataset.rate; state.lp=1; render(true); return; }
  const pg = e.target.closest('[data-pg]'); if(pg && !pg.disabled){ const [k,v]=pg.dataset.pg.split(':'); state[k]=+v; render(false); const l=$('#list'); if(l) window.scrollTo({top:l.getBoundingClientRect().top+scrollY-150}); return; }
  const h = e.target.closest('.sent-h'); if(h){ toggle(h.parentElement); }
});
document.addEventListener('keydown', e=>{
  const el = e.target.closest ? e.target : document.body;
  if(el.matches('input,select,textarea')) return;
  if((e.key==='Enter'||e.key===' ') && el.matches('.sent-h')){ e.preventDefault(); toggle(el.parentElement); return; }
  if(state.q) return;
  if(e.key==='ArrowRight' && state.page<T.length) go(state.page+1);
  if(e.key==='ArrowLeft' && state.page>0) go(state.page-1);
});
function toggle(card){
  const open = card.classList.toggle('open');
  card.querySelector('.sent-h').setAttribute('aria-expanded', open);
  if(open) fillDetail(card);
}
document.addEventListener('change', e=>{
  if(e.target.id==='sRate'){ state.sRate=+e.target.value; state.sp=1; render(true); }
  if(e.target.id==='sTopic'){ state.sTopic=+e.target.value; state.sp=1; render(true); }
});
let timer;
function setQuery(v){ $('#q').value=v; state.q=v.trim(); state.sp=1; $('#qclear').style.display=v?'block':'none'; render(); }
$('#q').addEventListener('input', e=>{
  clearTimeout(timer); const v=e.target.value;
  $('#qclear').style.display=v?'block':'none';
  timer=setTimeout(()=>{ state.q=v.trim(); state.sp=1; if(!state.q){ render(); } else render(true); }, 200);
});
$('#qclear').onclick = ()=>{ $('#q').value=''; state.q=''; $('#qclear').style.display='none'; render(); $('#q').focus(); };
$('#theme').onclick = ()=>{
  const r=document.documentElement, cur=r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.dataset.theme = cur==='dark'?'light':'dark';
  try{ localStorage.setItem('rv-theme', r.dataset.theme) }catch(_){}
};
try{ const th=localStorage.getItem('rv-theme'); if(th) document.documentElement.dataset.theme=th }catch(_){}
const h0 = parseInt(location.hash.slice(1),10); if(!isNaN(h0)) state.page=Math.max(0,Math.min(T.length,h0));
render(true);
})();
</script>
</body>
</html>
