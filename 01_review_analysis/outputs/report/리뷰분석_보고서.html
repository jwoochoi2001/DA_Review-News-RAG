<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 주제 분석 보고서</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0eee9; --ink:#1d1f23; --muted:#5d6470; --line:#e1ded6;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#dcebe9;
  --r1:#b3392b; --r2:#cf7a1f; --r3:#5f7390; --mark:#fde68a;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 14px rgba(20,20,20,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1d2024; --surface2:#262a2f; --ink:#ecebe7; --muted:#a2a8b2; --line:#33383f;
    --accent:#7cc4bd; --accent-ink:#0e1f1e; --accent-soft:#1f3534;
    --r1:#ef7d6e; --r2:#e5a259; --r3:#8ea4c2; --mark:#6b5a12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1d2024; --surface2:#262a2f; --ink:#ecebe7; --muted:#a2a8b2; --line:#33383f;
  --accent:#7cc4bd; --accent-ink:#0e1f1e; --accent-soft:#1f3534;
  --r1:#ef7d6e; --r2:#e5a259; --r3:#8ea4c2; --mark:#6b5a12; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.search{position:relative;flex:1 1 320px;max-width:520px}
.search input{width:100%;padding:9px 36px 9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 8px;display:none}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}
nav.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
nav.side h2{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:2px 8px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;line-height:1.3}
.nav-item:hover{background:var(--surface2)}
.nav-item.on{background:var(--accent);color:var(--accent-ink)}
.nav-item .no{width:22px;flex:none;font-size:12px;opacity:.7;text-align:right}
.nav-item .nm{flex:1;font-size:14px}
.nav-item .ct{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.jump{display:none;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
main{min-width:0}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.dist{display:grid;gap:7px}
.dist-row{display:grid;grid-template-columns:44px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
.stars{font-weight:600}
.num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.btn{border:0;cursor:pointer}
.chip.btn:hover{outline:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.ctrl .grow{flex:1}
.rep{display:grid;gap:10px}
.pair{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.pair .en{font-weight:500}
.pair .ko{color:var(--muted)}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sent-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:11px 14px;cursor:pointer;align-items:start}
.sent-h:hover{background:var(--surface2)}
.badge{display:inline-block;min-width:34px;text-align:center;padding:1px 7px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;margin-top:2px}
.b1{background:var(--r1)}.b2{background:var(--r2)}.b3{background:var(--r3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .badge{color:#14161a} }
:root[data-theme="dark"] .badge{color:#14161a}
.sent .en{font-size:15px}
.sent .ko{color:var(--muted);margin-top:2px}
.sent .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.sent .meta .tp{display:block;margin-top:3px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:normal;max-width:150px;margin-left:auto}
.detail{display:none;border-top:1px dashed var(--line);padding:12px 14px 14px;background:var(--surface2)}
.sent.open .detail{display:block}
.detail h4{margin:0 0 6px;font-size:13px}
.dtitle{font-weight:600}
.dmeta{font-size:12px;color:var(--muted);margin-bottom:8px}
.full{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.rs{padding:6px 10px;border-radius:8px;margin-bottom:4px}
.rs.cur{background:var(--surface);outline:2px solid var(--accent)}
.rs .en{font-size:14px}.rs .ko{font-size:13px;color:var(--muted)}
.rs .tag{font-size:11px;color:var(--accent);cursor:pointer;margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
.pager button{min-width:34px;padding:5px 9px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px}
.pager button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .gap{color:var(--muted)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pn button{flex:1;max-width:48%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.pn button:hover{border-color:var(--accent)}
.pn button.next{text-align:right}
.pn small{display:block;color:var(--muted);font-size:12px}
.pn .empty{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--surface2)}
.minibar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);min-width:90px}
.minibar i{display:block;height:100%}
.share{height:8px;border-radius:4px;background:var(--accent);opacity:.8}
.note{font-size:13px;color:var(--muted)}
.note li{margin:3px 0}
.empty-msg{padding:30px;text-align:center;color:var(--muted)}
.sr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sr select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
@media (max-width:860px){
  .brand{flex:1;margin-right:0}
  .theme{order:2}
  .search{order:3;flex:1 1 100%;max-width:none}
  .wrap{grid-template-columns:1fr}
  nav.side{display:none}
  .jump{display:block;margin-bottom:12px}
  .sent-h{grid-template-columns:auto 1fr}
  .sent .meta{grid-column:2;text-align:left}
  .sent .meta .tp{margin-left:0;max-width:none}
  .dist-row{grid-template-columns:38px 1fr 92px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">리뷰 주제 분석 보고서<small>헤어 디퓨저 · 1~3점 리뷰 · 문장 단위 BERTopic</small></div>
  <div class="search"><input id="q" type="search" placeholder="리뷰 검색 (영어 원문 또는 한국어, 공백으로 여러 단어)" autocomplete="off" aria-label="리뷰 검색"><button class="clear" id="qclear" aria-label="검색어 지우기">×</button></div>

</div></header>
<div class="wrap">
  <nav class="side" id="side" aria-label="주제 목록"></nav>
  <main id="main"></main>
</div>

en't used it, yet","아직 써 보지 않았는데"],["AB0688968_02","AB0688968",2,3,3,"that's likely because it doesn't fit on my blow dryer, properly","아마 제 블로우 드라이어에 제대로 맞지 않기 때문일 겁니다"],["AB0688968_03","AB0688968",3,9,3,"I struggled for TWENTY MINUTES to even get it on halfway.","반쯤 끼우는 데만 20분을 씨름했습니다."],["AB0688968_04","AB0688968",4,0,3,"I think the stretch could be a bit better for fitting it over the mouthpiece of a blow dryer.","블로우 드라이어 입구에 씌울 수 있도록 늘어나는 정도가 조금 더 좋았으면 합니다."],["AB0693475_01","AB0693475",1,13,1,"Useless.","쓸모없습니다."],["AB0693475_02","AB0693475",2,0,1,"Doesn’t fit a single hairdryer so far.","지금까지 헤어드라이어 단 하나에도 맞지 않았습니다."],["AB0693475_03","AB0693475",3,7,1,"And like someone else said, it’s too flimsy to be useful.","다른 분 말씀처럼 너무 허술해서 쓸모가 없습니다."],["AB0693949_01","AB0693949",1,2,3,"I wanted to like this diffuser","이 디퓨저가 마음에 들기를 바랐는데"],["AB0693949_02","AB0693949",2,0,3,"it was too small for the hotel’s hairdryer","호텔 헤어드라이어에는 너무 작았습니다"],["AB0693949_03","AB0693949",3,11,3,"I didn’t get to use it.","써 보지 못했습니다."],["AB0693949_04","AB0693949",4,8,3,"It’s lightweight and compact for what it is, so there’s that.","가벼워서 이 정도 제품치고는 작고 휴대하기 좋다는 점은 있습니다."],["AB0694045_01","AB0694045",1,1,3,"because it is a light rubber, it collapses easily perhaps I need to pull harder to make it stay in place.","가벼운 고무라서 쉽게 접히는데 제가 더 세게 당겨 고정해야 하는 걸 수도 있습니다."],["AB0700212_01","AB0700212",1,4,3,"It was great for the first few months","처음 몇 달은 아주 좋았는데"],["AB0700212_02","AB0700212",2,3,3,"then it melted to my blowdryer.","그러다 제 블로우 드라이어에 녹아 붙었습니다."]],"reviews":{"AB0006347":{"r":1,"t":"A hard pass","x":"While I wanted to love this, it just didn’t work. After getting it into my hair dryer, it kept collapsing. Wasn’t worth the struggle.","d":"2020-09","h":0,"v":false},"AB0008501":{"r":3,"t":"Unhappy","x":"I don't like that it does not fit tightly on my dryer. It has 3 grooves like to insert something and that impacts it's hold on my dryer. Plus, the cap with the prongs comes off constantly. I will be returning this. 😒","d":"2020-06","h":0,"v":true},"AB0009820":{"r":1,"t":"Collapses during use","x":"Collapses during use. Is a little big for my 1.75 inch diameter hair dryer. But since it’s rubbery it grips the end enough to work. But honestly it’s pricey for the fact that it collapses. It worked well for my daughter who has thicker hair and curls but my hair is thinner and it just frizzed it out bad.","d":"2021-03","h":0,"v":true},"AB0010097":{"r":1,"t":"Fit for normal hairdryer","x":"Doesn't fit a normal hairdryer- disappointed","d":"2016-03","h":0,"v":true},"AB0010884":{"r":2,"t":"Great idea but...","x":"I have thick, long, wavy/curly hair and was excited when this arrived as it seemed well made & collapses to a very compact size - my normal Solano diffuser works great but is big, bulky and takes up a lot of space when packed for travel - and then I tried to use it. It seemed to fit my HOT Tools tourmaline 2000 dryer, but as I dried my hair and the diffuser got warm, it slipped, collapsed, and wobbled from side-to-side making it impossible to use. Unfortunately, this is being returned.","d":"2016-03","h":1,"v":true},"AB0011202":{"r":3,"t":"Almost perfect","x":"Exactly as described. Collapsible and compact. Perfect for traveling. The material isn't strong enough to not collapse while using especially as it gets hotter. I have curly hair and use the prongs closer to roots for lift as it presses against my scalp it begins to flex and fold up. I expected a firmer material. But still, it works as described and great for traveling.","d":"2017-10","h":1,"v":true},"AB0011386":{"r":2,"t":"Very collapsible but not a universal fit","x":"The opening on the end that attaches to hairdryers is quite small. It frequently pops off my hairdryer so I have to hold it on when using it","d":"2022-10","h":1,"v":true},"AB0012331":{"r":3,"t":"Not 100% Universal","x":"I just came back from a trip to Vietnam. I stayed in 5 different hotels, and this attachment only worked on 3 of the dryers in those hotels. This diffuser attachment is great when it attaches to the dryer, but it is not truly universal.","d":"2018-04","h":0,"v":true},"AB0014097":{"r":1,"t":"Material is not durable","x":"The diffuser ripped after the second time I used it","d":"2018-09","h":0,"v":true},"AB0014120":{"r":2,"t":"It won’t fit","x":"It’s a beautiful diffuser it says that it will fit 2.5 which is what my dryer is, but it does not work it’s probably like another gal had said 2.0 it won’t stretch over the outside I’m gonna have to send it back. I wish it fit.","d":"2020-11","h":1,"v":true},"AB0014924":{"r":3,"t":"Better than nothing while","x":"eh, works ok. I still use my big bulky cracked plastic diffuser. Was hoping to replace it, no suitable candidates yet. This collapses while using. Better than nothing while traveling","d":"2016-08","h":1,"v":true},"AB0016002":{"r":1,"t":"One Star","x":"The diffuser collapses easily. If I could give it a negative star I would.","d":"2017-07","h":0,"v":true},"AB0016640":{"r":3,"t":"had to buy a different hair dryer so it would ...","x":"had to buy a different hair dryer so it would fit. It's not universal at all way to small for that. I had to find one that was smaller at the end then all the other dryers out there. Sorry but would not purchase again.","d":"2017-04","h":1,"v":true},"AB0016734":{"r":2,"t":"Wouldn’t recommend.","x":"Not my favorite. This product has a big cult following within the curly hair community on Instagram and Facebook so I was quick to purchase and try it out but the lack of bowl on it made it a flop for me. It can’t cup the hair so it just flies around. Worked well on the end of my oddly shaped Fredrick fekkai dryer though.","d":"2018-03","h":0,"v":true},"AB0018095":{"r":2,"t":"meh","x":"Did not fit my dryer, measure yours first.","d":"2019-12","h":0,"v":true},"AB0020270":{"r":3,"t":"Fell apart after 3rd use!","x":"Very disappointed ….the screen fell out after only 3 uses. I loved how it worked, and it’s collapsible for travel, and it is lightweight. But after just a few uses….to fall apart like that? Ugh! Never will I buy another","d":"2021-09","h":0,"v":true},"AB0024818":{"r":2,"t":"Not recommended.","x":"Works ok. keeps collapsing. The nubs on the main part don't pick up hair at all.","d":"2018-07","h":0,"v":true},"AB0025590":{"r":1,"t":"Nope.","x":"Did not fit my hairdryer correctly without straining pushing pulling everything. Once I finally got it on the airflow was not significant and I returned immediately.","d":"2017-06","h":0,"v":true},"AB0026943":{"r":2,"t":"Not so good.","x":"It doesn't stay on my hairdryer for long and the end keeps pushing back in instead of staying out to use the diffuser.","d":"2017-07","h":0,"v":true},"AB0028687":{"r":1,"t":"It doesn't work, don't buy it!","x":"Worst invention ever! This got returned to Amazon 30sec after trying it. The attachment part has to be forcefully stretched over hair dryer nosel. it pops off a lot and the silicon gets so hot that you can't even try to put back on until it cools down . The worst is that it collapses as you try to use it! Seriously! It has no weight to the product so can't use on roots /scalp. It's just completely worthless.","d":"2018-01","h":16,"v":true},"AB0030676":{"r":2,"t":"Two Stars","x":"This did not fit my hairdryer.","d":"2018-04","h":0,"v":true},"AB0031769":{"r":3,"t":"Three Stars","x":"It's okay. Doesn't stay on the hairdryer very well.","d":"2016-09","h":1,"v":true},"AB0033463":{"r":2,"t":"collapses while drying hair.","x":"Collapses while trying to dry hair. May be a spacesaver but such a pain.","d":"2016-09","h":1,"v":true},"AB0038459":{"r":1,"t":"Would not fit","x":"Very disappointed, would not fit on my hairdryer.","d":"2017-04","h":0,"v":true},"AB0039014":{"r":3,"t":"Will only use for travel.","x":"This is helpful for travel since it doesn't take up as much space. However, it collapses too easily. So it's a bit of a pain to use. I thought maybe it would replace my current diffuser at home as well, but that is not the case. Still looking for a better solution.","d":"2020-07","h":0,"v":true},"AB0039266":{"r":3,"t":"Almost IMPOSSIBLE to put on, and collapses far too easily.","x":"Overall, it's not terrible, but it took me forty five minutes (and two broken fingernails) to get the thing onto my completely standard-sized dryer. Also, whenever I use it, I find that it collapses down with the slightest touch against my scalp, which gets annoying when you have a large amount of hair that takes a long time to diffuse.","d":"2018-09","h":0,"v":true},"AB0039835":{"r":3,"t":"Better than nothing","x":"I really wanted to love this thing but my hair looks like garbage every time I use it. I’ve gotten used to having a lighter hand so it doesn’t collapse so easily on me, but it still doesn’t do a good job. It really struggles to get my hair in clumps. It separates my curls too much so my normally 3a/b hair turns into a stringy 3b. I keep this in my suitcase because it’s better than nothing but I wouldn’t use this on a daily basis. My hair just looks like crap when I travel now.","d":"2020-01","h":0,"v":true},"AB0040209":{"r":3,"t":"It doesn't fit the Dyson Airwrap","x":"I'm sure it's a good product but it doesn't fit the Dyson airwrap","d":"2021-08","h":2,"v":true},"AB0040995":{"r":3,"t":"Not good if you have alot of hair","x":"Does not work well if you have alot of hair or if it takes a long time to dry your hair. The diffuser keeps collapsing. And I have alot of hair and when the diffuser gets too hot, the middle piece falls out. Only way for it to stay is to keep stopping and letting the rubber cool down.","d":"2021-02","h":1,"v":true},"AB0041862":{"r":3,"t":"Not as sturdy but excellent for travel","x":"Diffuses okay... maybe my hair is too long or I have too much of it, but I found that it collapsed on itself pretty often. Not as study as I would have liked but great for traveling.","d":"2019-07","h":0,"v":true},"AB0042835":{"r":1,"t":"The rubber band securing the diffuser to the dryer snapped ...","x":"The rubber band securing the diffuser to the dryer snapped right away. I can still use it, but it falls off mid dry session and I'm constantly picking it up off the floor.","d":"2017-07","h":1,"v":true},"AB0042838":{"r":2,"t":"Did NOT work!","x":"It's not the best! Collapses constantly and I have to actually hold it on the dryer entire time I use it...A real pain!! I have a Rusk weightless hairdryer so really don't have many options due to its small nozzle. Only reason I went with this model was bc I read in questions it would fit. I would send back, but I think I waited too long 😣. Maybe some find it useful, but I did not especially for $15.","d":"2021-02","h":0,"v":true},"AB0046839":{"r":3,"t":"Three Stars","x":"This is \"too\" collapsible.","d":"2017-02","h":0,"v":true},"AB0048169":{"r":3,"t":"A hit and miss item","x":"It barely fit on one hair dryer and it was too small for another hair dryer. Will put it in my travel bag but it probably won't work on some dryer.","d":"2017-04","h":0,"v":true},"AB0048665":{"r":2,"t":"Hard to use","x":"It’s great that it’s collapsible for storage but it kept flopping while i was trying to diffuse my hair. And it’s flat versus other diffusers I’ve used in the past, my hair wouldn’t really stay and my hair would fall to the sides, i would just be blow drying my roots.","d":"2018-06","h":0,"v":false},"AB0049440":{"r":1,"t":"Wouldn’t recommend.","x":"Does NOT fit a normal hair dryer. Tried to stretch it over my hair dryer and it tore, and it’s too big for a mini hair dryer. Wouldn’t recommend.","d":"2018-04","h":0,"v":true},"AB0052440":{"r":3,"t":"Great idea, poorly executed","x":"Bought this for travel but returned it immediately. It does NOT fit my BaBylissPRO Tourmaline Titanium Travel Dryer (I can get it on, but it's way too loose, falls off almost immediately). Also it's very easy to collapse the diffuser, you barely touch it and it's jumping back into it's small shape, very annoying when you're trying to dry a lot of curls and have to keep pulling it open again and again.","d":"2018-01","h":1,"v":true},"AB0056608":{"r":3,"t":"Fine for travel, don't recommend for daily use","x":"I bought this for a business trip because it's collapsible and my carry on space is limited. While it travels extremely well and does appear to fit over any hotel hair dryer, there is no mechanism that keeps it rigid after you unpack it, so it has a tendency to collapse on itself during use. I solved the problem by using one hand to hold the dryer and one to hold the diffuser in the open position. This is fine for a $12 travel diffuser but definitely annoying. My hair looked fine after use. Not as good as with my normal diffuser but better than an air dry.","d":"2017-10","h":1,"v":true},"AB0056816":{"r":3,"t":"Fits fine over the end of my dryer","x":"Fits fine over the end of my dryer, and actually worked well when I could keep it from continually collapsing in on itself. After awhile I just used it flat. Tired of fighting with it.","d":"2017-07","h":2,"v":true},"AB0056959":{"r":3,"t":"An OK hair tool, but could use some improvements","x":"After buying a new blowdryer, I immediately threw away the diffuser that came with it, because I NEVER used one and have shorter hair, only to realize about a month later that I wanted to try using one on my hair that I have been growing out for over a year now. I have only used this a few times now, but it doesn't fit great on my blowdryer - I really have to cram it on. It also tends to fold on itself and droop as I'm using it, most likely from the heat making it soft and because the wide top is a little heavy compared to the soft rubbery body. It does fold down nice and flat for storage. It's an OK tool, especially for something I don't use every day.","d":"2017-08","h":3,"v":true},"AB0058749":{"r":3,"t":"I bought this diffuser so I didn't have to take ...","x":"I bought this diffuser so I didn't have to take my larger device while traveling. I thought this might fit onto the hair dryers in hotel rooms but it did not fit any of the hair dryers I've encountered yet, including my own.","d":"2018-01","h":1,"v":true},"AB0060363":{"r":3,"t":"Great for travel","x":"Great space saver if you are traveling but for daily use, I would not buy again. My biggest issue is that it collapses while using it folding back on to itself if you apply the smallest amount of pressure against your head. Also, it did not fit my Conair dryer but because it is silicone I was able to stretch the sleeve with some serious force. No issues with heat.","d":"2020-01","h":0,"v":true},"AB0061143":{"r":2,"t":"I’m sure if I get it on it’ll be great.","x":"I can’t figure out how to get the darn thing on the end of my blow dryer. I have a standard, compact one, nothing special. I’m sure if I get it on it’ll be great.","d":"2018-02","h":0,"v":true},"AB0063631":{"r":1,"t":"Poor design!","x":"Broke on the 3rd day of using it!! Very disappointed! It is very aggravating when using, it keeps collapsing which is not fun.","d":"2018-05","h":0,"v":true},"AB0064273":{"r":3,"t":"Folds up, and let's lots of air come through, but....","x":"It will collap while using it to dry your hair. It gets really hot from the dryer, and it let's lots of air through. Not sure it's really diffusing.","d":"2021-08","h":0,"v":true},"AB0064811":{"r":1,"t":"One Star","x":"Horrible. The balls fell off on the first use. Kept collapsing while on my blow dryer.","d":"2016-09","h":1,"v":true},"AB0069035":{"r":1,"t":"Too small","x":"It didn't fit my conair hair dryer :(","d":"2016-12","h":1,"v":true},"AB0069157":{"r":2,"t":"Two Stars","x":"THEY DIDN'T WORK FOR ME.","d":"2018-06","h":0,"v":true},"AB0069465":{"r":2,"t":"Like the idea, but broke during second use","x":"I like the idea of this travel diffuser so much! The second time that I used it the silicone had cracked around where it attached to the hair dryer. Maybe it was because of the snug fit? I haven't ever seen silicone split before, so it was a huge bummer! I would not recommend this product unless you could try it on to your blow dryer. Or, now that nobody is traveling because of COVID, I'd just buy a new blow dryer that comes with a diffuser that fits for sure.","d":"2020-09","h":0,"v":true},"AB0071608":{"r":1,"t":"Does not fit the T3 Featherweight 2 dryer","x":"I bought this to fit the T3 Featherweight 2 dryer. The dryer opening is 2.25\". The diffuser does not fit. I tried to stretch it over the end of the dryer and the diffuser ripped. 😤","d":"2018-08","h":0,"v":true},"AB0072136":{"r":2,"t":"Didn't fit","x":"The diffuser product was OK but it was too large for my hair dryer and would not stay on.","d":"2016-02","h":2,"v":true},"AB0075851":{"r":2,"t":"Floppy","x":"It worked fairly well as a diffuser but it was super floppy. It kept collapsing when I tried to use it, and fit pretty tight but flew off when I was in the middle of drying my hair. I am returning it because it was too hard to use with the continued floppiness and collapsing.","d":"2016-07","h":1,"v":true},"AB0075858":{"r":3,"t":"Not bad for a universal component.","x":"Works ok, but on my particular drier it keeps collapsing so I keep have to poo it back out. Still gets the job done.","d":"2020-07","h":0,"v":true},"AB0076807":{"r":3,"t":"It's going to be great! My son took my suggestion and sliced off ...","x":"It's going to be great! My son took my suggestion and sliced off two of the inner \"grippers\" to make it wide enough to fit over my blower! We shall see tomorrow! He said he's used a diffuser and to be patient. I will! I will review again after I see. :-)","d":"2016-08","h":1,"v":true},"AB0079424":{"r":1,"t":"Terrible Product. Not worth your money. Spend a bit more to get something amazing.","x":"Update. I put the first piece in the second piece and tried to use it, but it just collapses. Terrible product. Came broken in two pieces. Even if I had superglued it, it's really really floppy. It did look like it would fit my dryer though. I have a Revlon Essentials I got at Walmart for about $15.","d":"2019-03","h":0,"v":true},"AB0079650":{"r":2,"t":"Quality fine, not best fit for me","x":"Decided to return product. I have fine hair and it kept collapsing as I used it. Just not a good fit for me.","d":"2019-01","h":0,"v":true},"AB0082412":{"r":2,"t":"not good for fine/thin hair","x":"i already had a rigid diffuser but thought i would try this as it had great reviews......not good for fine/thin curly hair, the device just pushes to your head leaving a crimped look not the loose curls look i needed. I tried multiple times to make it work for me but it is too \"soft\" to take care of my hair","d":"2018-06","h":0,"v":true},"AB0083907":{"r":3,"t":"Great product, but starting to fall apart!","x":"I really like this diffuser, it works great and collapses down nicely for travel. I have found that I'm using less product in my hair, which is a bonus because it takes less time to dry in the morning! The one drawback that I've noticed is that the top part tends to detach, and the center pin has fallen out. I've used this diffuser less than 20 times so far, and that makes me concerned about how it will hold up over the long run.","d":"2016-07","h":6,"v":true},"AB0087030":{"r":2,"t":"Didn’t fit","x":"It didn’t fit my hair dryer so I had to cut it so it would somewhat fit . I doubt it will last very long it seems very fragile","d":"2018-01","h":1,"v":true},"AB0091245":{"r":2,"t":"does not fit on standard hair dryer nozzle- very odd ...","x":"does not fit on standard hair dryer nozzle- very odd! with every attempt to get it to stretch couldn't get it on a regular hairdryer. had to return it.","d":"2018-08","h":0,"v":true},"AB0091792":{"r":1,"t":"worse diffuser","x":"Be warned this is the worse hair diffuser I ve ever used...it won't stay upright once it gets hot...it does not work like a regular diffuser...","d":"2016-07","h":1,"v":true},"AB0092222":{"r":1,"t":"Doesn’t stay on","x":"Doesn’t stay on any of my 3 dryers. All different size nozzles. One nozzle is very wide for a blow dryer. Too bad because it’s a great idea.","d":"2019-05","h":0,"v":true},"AB0093397":{"r":3,"t":"Fell Apart After Four Months Use","x":"Purchased less than four months ago and already it has fallen apart (see photo). So why am I buying another one? Well, my wife likes the way it works, the way it travels and the fact that it fits her hair drier perfectly. And you know the old saying, \"Happy wife, happy life.\" And it does make her hair look terrific. This time she'll be more careful when removing it and try not to remove it when it's hot. She will also pull it off by the sleeve and not the diffuser itself. I'll let you know if that helps. But honestly, Curly Company, it really shouldn't fall apart after only a few months use, should it?","d":"2016-07","h":40,"v":true},"AB0094612":{"r":1,"t":"Didn't fit","x":"I was hoping to use this with a hair dryer from a hotel. Well it didn't stretch big enough to fit over the nozzle. I ended up just using the hair dryer as is and ended up with very very crazy hair, and then the rest of the trip I just showered at night and went to bed with wet hair. That is far from ideal and hoped not to catch a cold doing that.","d":"2022-10","h":0,"v":true},"AB0095667":{"r":2,"t":"Just buy the sturdy, more expensive one!","x":"First I had to force it on to me dryer and actually cut off a section of tje grip on the inside, but once it was on it worked great for a while!! Hair stayed voluminous all day and still dried thoroughly, and it didnt take a lot of effort to get that fluff....BUT, after a couple months, the face of the diffuser popped off and I thought, I'll just glue it back on. But, everything I tried it just wouldn't stay on....only got a couple months use out of it and I've had my blow dryer for years. I expect things like that to last amd be an investment. Now, here I am back on look I g dor a diffuser. Just buy the sturdy, more expensive one...it'll be the greater investment in the long run.","d":"2018-05","h":1,"v":true},"AB0097251":{"r":3,"t":"not stretchy","x":"while the product is exactly as pictured and would be a great diffuser, it did not fit my dryer and does not stretch at all as I thought it would given the material :( make sure you measure your dryer's diameter before purchasing as it does not leave room for anything bigger than its size","d":"2018-12","h":0,"v":true},"AB0098933":{"r":3,"t":"Ehh, it’ll do for travel","x":"Great for traveling. It’s smaller than most diffusers. But it collapses while in use. You have to be gentle. I Don’t love the way curls come out either. Maybe I have to work with it more. Like I said, I’ll use it only for travel, I could care less how my hair looks on vacation. So much hype with this diffuser in the CG community.","d":"2020-02","h":0,"v":true},"AB0100453":{"r":3,"t":"Broke after 3 months","x":"Definitely not universal. Does Not fit oval. And broke after 3 months. Screen popped out","d":"2018-06","h":0,"v":true},"AB0100813":{"r":1,"t":"Collapses all the time.","x":"Stays on after you MASH it onto the hair dryer well enough, so it has that going for it. But it is almost unusable as it even collapses under the weight of my wet hair! Basically, it is really difficult to use","d":"2017-10","h":3,"v":true},"AB0101047":{"r":1,"t":"Too collapsible","x":"Very packable but collapses too easily to be of any use. Very difficult to get on end of any size hotel hair dryer whether it be standard or travel, then won't stay on the dryer. Made of sturdy materials however.","d":"2016-12","h":2,"v":true},"AB0104606":{"r":2,"t":"Good in theory but...","x":"Though good in theory, not good in practice. It's great for travel, but collapses while using it while attached to the dryer. Not very practical so I ended up buying a different one.","d":"2016-08","h":1,"v":true},"AB0106323":{"r":1,"t":"Disappointing","x":"I've heard great things about this diffuser so I bought it twice. The first time I used it twice and it fell apart. This time, the middle was already coming apart from the outer portion. I still have it on my dresser trying to figure out if I should glue it myself and keep it or just return it like the last one.","d":"2019-01","h":0,"v":true},"AB0107764":{"r":3,"t":"Research a better brand!","x":"Would have been a good concept but mine broke the 2nd time I used it :(","d":"2018-08","h":0,"v":true},"AB0109581":{"r":3,"t":"Like that it's collapsible","x":"Doesn't stay on as well as some diffusers. Like that it's collapsible.","d":"2017-06","h":0,"v":true},"AB0109977":{"r":2,"t":"Great idea, flimsy material that collapses while using","x":"This collapsible diffuser is a great idea, But only for travel. The problem is it collapses while I'm trying to dry my hair too. Great idea, but too flimsy to keep its shape while using.","d":"2018-02","h":0,"v":false},"AB0112536":{"r":3,"t":"I like the results but the inside part fell after 1 ...","x":"I like the results but the inside part fell after 1 month, it still works but I have to be putting it back every time.","d":"2018-04","h":0,"v":true},"AB0113538":{"r":2,"t":"Does not stay extended. Rubber neck easily folds and retracts.","x":"Flimsy and doesn’t stay extended when diffusing. Simply putting hair on it makes it retract. Debating returning this item.","d":"2018-02","h":0,"v":true},"AB0114081":{"r":1,"t":"Don't Waste Your Time.","x":"Don't waste your time with the diffuser. I understand that it is collapsible for storage/travel, but the diffuser will not stay open while in use. Anytime I would move my hair dryer, it would collapse. I even tried using it while collapsed, but it was useless, so it was returned.","d":"2017-05","h":1,"v":true},"AB0115784":{"r":1,"t":"Difficult to put on, keeps collapsing while I am drying my hair.","x":"I have curly hair and thought it was time to buy a diffuser attachment for my hairdryer. I measured the mouth portion of my hairdryer before I purchased this. It said a 2\" opening would be a good fit. It was extremely difficult to put on over my hairdryer. Well, after using some creativity, lots of finger and hand muscle and a bit of frustration I stretched it over the hairdryer opening. Then while using it, it collapsed several times while I was drying my hair. This was even more frustrating than putting it on the hairdryer itself! I still may return it, I usually air dry my hair. I do not recommend unless you need for travel and have no better option.","d":"2020-09","h":1,"v":true},"AB0116520":{"r":2,"t":"Doesn't fit most hair dryers","x":"I have travelled with it to multiple cities both in US and internationally, and it has only fit one hotel hair dryer. It is too small for the rest. I am looking for another.","d":"2019-11","h":0,"v":true},"AB0117170":{"r":3,"t":"good as a diffuser but collapses","x":"Works fine as a diffuser and fits my dryer. (I have a standard-sized Remington.) Constantly folds down while I'm using it, which is annoying, but no issues otherwise.","d":"2018-11","h":0,"v":true},"AB0118334":{"r":1,"t":"Doesn’t fit most dryer’s","x":"This was a waste of money for me. The description should contain exact dryers this made for as it is not for my hair dryer which is made from a known hair company.","d":"2020-01","h":0,"v":true},"AB0119106":{"r":2,"t":"Doesn't fit my dryer","x":"1. Before even trying to fit it on my dryer the small silver thingy on the diffuser came flying off 2. It doesn't fit my dryer....tried for like an hour and nothing! Wouldn't stretch at all. 3. I guess I tried too hard cause it now has a small tear right at the opening that may start stretching. Heard great things BUT unfortunately I can't decide for myself since it doesn't fit and is now broken","d":"2017-02","h":0,"v":true},"AB0120677":{"r":3,"t":"Just not quite what I need in a diffuser","x":"Unfortunately the sides of the diffuser are too shallow to hold my long hair. My hair spills over the sides, then the rest of my strands slide out of the diffuser. It only works to dry the lower half of my hair. I used to own the perfect diffuser, but it broke with age. I'm still looking for one with higher sides. This does work well if you are a traveler, packs away nicely.","d":"2020-05","h":0,"v":true},"AB0122231":{"r":1,"t":"Fell apart after just a couple of times using !!!","x":"I bought this diffuser and after using just a couple of times it completely fell apart. The rubber at the connection point started tearing and the filter would not stay on. Very dissatisfied. Especially with how much it cost compared to other diffusers. I finally just threw it in the garbage. Waste of money .","d":"2018-10","h":6,"v":true},"AB0123075":{"r":2,"t":"Very frustrating and annoying.","x":"I personally couldn’t handle the fact that it’s constantly collapsing. Very frustrating and annoying.","d":"2017-12","h":0,"v":false},"AB0125049":{"r":3,"t":"Three Stars","x":"very flimsy","d":"2018-07","h":0,"v":true},"AB0125405":{"r":2,"t":"Not that good","x":"Broke to fast and it would fold a lot when I would use it .","d":"2018-07","h":0,"v":true},"AB0125758":{"r":1,"t":"Did not fit!","x":"This company promises that this diffuser was universal and fit almost any dryer. It was too small for mine!","d":"2016-08","h":1,"v":true},"AB0126006":{"r":3,"t":"Too collapsible.","x":"I have always used a deeper cup that I could actually get more hair into and hold up to my scalp. But there are none currently on Amazon so I went with this one. Figuring the collapsible travel part would be a bonus. However when I place this under my hair and lift up to scalp it collapses against my head. I will probably keep this one for travel but keep an eye out for one that won't collapse against my head.","d":"2017-04","h":1,"v":true},"AB0126395":{"r":1,"t":"Not great","x":"Returned product. It wouldn't stay extended and collapsed with the lightest amount of pressure when drying my hair.","d":"2018-04","h":0,"v":true},"AB0126534":{"r":3,"t":"Compact, kinda hard to keep on dryer","x":"Kind of hard to keep it on the dryer","d":"2020-07","h":0,"v":true},"AB0126791":{"r":1,"t":"Broke before using. Don’t waste your money","x":"POS do not buy . The second I opened it the piece fell right out . I could pop it back in but it just fell out again and again . The knobs aren’t the same color as in the images . They are solid black so maybe I got a defect ? But still... don’t waste your time .","d":"2021-03","h":0,"v":true},"AB0126966":{"r":1,"t":"One Star","x":"Smelled bad. Had to return it.","d":"2018-04","h":1,"v":true},"AB0127803":{"r":1,"t":"Broke after 3 uses!","x":"Used it 3 times and it is already broken!!!! Same as a few other reviews with pictures but the inside completely came apart. Before it broke I didn't like that it keep collapsing when using. I have medium length hair. I figured it did impact how it worked but it was still annoying!","d":"2018-04","h":1,"v":true},"AB0128725":{"r":1,"t":"Do NOT buy!","x":"What a waste of money. I really wanted to love it. Especially since it saves space by collapsing but it doesn't stay extended while in use. It keeps collapsing on me. AND the center of the diffuser has a small plastic piece that keeps falling out. It's soooo annoying! Wish I never bought it. I do not recommend this defuser.","d":"2022-11","h":1,"v":true},"AB0130094":{"r":3,"t":"I brought this because all the curlies love it.","x":"I brought this because all the curlies love it... right when I was about to fall in love with it it fell apart on me not even a month after I bought it... not sure what happen but it happen..... If it didn't just start falling apart I would of given it 5/5( i think since it wasnt even a full month).... I also emailed and still no response...","d":"2018-03","h":0,"v":true},"AB0130107":{"r":2,"t":"So disappointed. I had such high hopes!","x":"I had SUCH high hopes for this diffuser. First off the opening was too big to fit on the end of my dryer, and then when I did find a dryer it fit, it would collapse while trying to dry my hair. Not worth the money for what I need it for. Oh and it got too hot while blowdrying my uber long curly hair and warped so it doesn't collapse all the way!","d":"2016-09","h":0,"v":false},"AB0130147":{"r":3,"t":"It does seem to collapse rather easily though and I noticed quite a bit of frizz ...","x":"This diffuser dries my hair quickly. It does seem to collapse rather easily though and I noticed quite a bit of frizz still. I still use this to partially dry my hair so it isn't soaking wet and then I usually let it air dry to avoid a ton of frizz.","d":"2016-03","h":1,"v":true},"AB0131096":{"r":1,"t":"It collapses","x":"Unfortunately it collapses. The warmer it gets with the heat of the dryer, it happens more. Returned it.","d":"2020-10","h":0,"v":true},"AB0131391":{"r":2,"t":"Doesn't fit, will be returned...","x":"Unfortunately, it is not universal. It does not fit a hair blower I purchased from Amazon. I need to return this, but I don't se a return option yet.","d":"2016-11","h":1,"v":true},"AB0133317":{"r":2,"t":"A little TOO collapsible","x":"I get it's supposed to collapse but it never stays open. Would not recommend.","d":"2019-04","h":0,"v":true},"AB0136738":{"r":2,"t":"Two Stars","x":"Didn't fit over my hair dryer and is a bit flimsy.","d":"2016-12","h":1,"v":true},"AB0136967":{"r":1,"t":"not universal!","x":"was not universal so did not fit my dryer","d":"2016-03","h":1,"v":true},"AB0137226":{"r":1,"t":"DO NOT RECOMMEND!","x":"Ugh this thing sucks. I bought it because I saw someone on instagram using it and thought it was cool....no, it is not. It is not practical. The stupid collapsible thing is a constant problem. As I'm diffusing my hair, it is constantly collapsing, making it difficult and annoying. My hair is long and curly and the weight of my hair will automatically collapse it anytime I try to put it on the diffuser. THEN, the diffuser gets really hot because it's made of silicone. The part that goes around the hair dryer gets especially hot, where you can't even touch it. Then, sometimes while I'm diffusing my hair, the diffuser will just fall off the hair blow dryer because it's not securely attached. You put the diffuser on your hair blow dryer like a sock and it constantly falls off. I am only using this right now while I'm desperate, but I'm going to be ordering a different diffuser asap !","d":"2018-01","h":12,"v":true},"AB0137483":{"r":3,"t":"Not my thing","x":"My hair looked a little frizzy after drying and it took forever to dry it. Really wasn’t for me.","d":"2020-02","h":0,"v":true},"AB0137836":{"r":3,"t":"A little too collapsible","x":"It was good, too collapsible for me... Meaning when I was drying my mud back length hair it would collapse if it held even 1/4 of my hair... Which for diffusing wavy/curly hair, kinda important...","d":"2019-08","h":0,"v":true},"AB0137904":{"r":2,"t":"Silicone makes for an un-sturdy product","x":"I had high hopes for this product because of the reviews, however I am disappointed. The product arrived dirty and dusty. It also looks like it was in used condition. That aside, I tested it out. The silicone is weak and really bendy. This lead to the diffuser collapsing during use. It would not stay extended long enough for me to dry a strand of hair. I had to constantly re-shape the diffuser and try and get it to stay up and in working order.","d":"2018-04","h":1,"v":true},"AB0138845":{"r":1,"t":"Waste of money","x":"Waste of money. The mouth on the device doesn't fit EITHER of my hair dryers. The seller should list which specific brand of dryers the diffuser can fit/latch onto.","d":"2016-10","h":4,"v":true},"AB0138877":{"r":3,"t":"Fit is key...","x":"This diffuser works fine if you have a hair dryer it fits, I have 3 hair dryers; it fit one of them - the Conair 1875, but not the 1875 Ion Shine. The latter has plastic projections on either side of the blower opening which don't allow a fit. The \"flexible\" opening of the diffuser does not really have any give, so it fits or doesn't.","d":"2016-07","h":3,"v":true},"AB0140637":{"r":1,"t":"Ridiculous claim of size and fit","x":"Absolutely WILL NOT fit the Conair Vagabond Compact 1875 Folding Handle Hair Dryer (124L) (ASIN B0012DL8B4.) Before I ordered I measured the hair dryer nozzle size (2.25\") and read the specs for this item (2.25\" connection diameter.) Well, the actual INSIDE DIAMETER of the diffuser connection is 2\" and it will NOT stretch to fit an opening 2.25\" across. Neither pliers, nor physical force, nor wishful thinking will make this thing stretch to fit on the dryer. BEWARE.","d":"2017-03","h":0,"v":true},"AB0143151":{"r":2,"t":"Broken before I got it :(","x":"Opened my package to find one of the nubby things had snapped and was floating in the packaging. Boo.","d":"2016-10","h":3,"v":true},"AB0144144":{"r":1,"t":"Cheap","x":"This is a horrible products, falls of my dryers and the lid with bead comes of with the air from the dryer.","d":"2017-12","h":1,"v":true},"AB0147784":{"r":3,"t":"The small round tips that you see in the picture come off easily, so it can cause problems if you have ...","x":"Works as describe, it needs some improvements. The small round tips that you see in the picture come off easily, so it can cause problems if you have kids. The universal fit can be more firm or better adjusting or griping material, otherwise my wife loves it and it is doing the job.","d":"2016-12","h":1,"v":true},"AB0147912":{"r":3,"t":"Great product but does NOT fit all dryers","x":"It’s a great product but does not stay on smaller hair dryer nozzles such as babylis. Falls off in the middle of the drying process if you’re not super careful. That said, it’s comfortable, travels easily and it’s a great price.","d":"2022-06","h":0,"v":true},"AB0148171":{"r":2,"t":"Doesn’t stay in place","x":"It doesn’t stay in place while using it, the holes are big (my hair would get caught up in the hair dryer).. I returned it","d":"2020-05","h":0,"v":true},"AB0149647":{"r":2,"t":"Two Stars","x":"It doesn't fit 3 different hair dryers that I already had. I should not have purchased this diffuser.","d":"2016-09","h":1,"v":true},"AB0150911":{"r":3,"t":"it's nice because it's portable","x":"Eh, it's nice because it's portable, but it also collapses super easily when you are drying your hair. I guess it's nice-ish to have, but I wouldn't buy another one or recommend it to anyone.","d":"2016-06","h":1,"v":true},"AB0151422":{"r":1,"t":"I like my ordinary diffuser better","x":"I did not care for it. It collapses everytime I use it. I like my ordinary diffuser better. Should had saved my money for the DevaCurl diffuser.","d":"2017-06","h":0,"v":true},"AB0152341":{"r":3,"t":"Good, but not blown away","x":"This is a good product. it actually fits my Sedu 4000i, which is a big plus. Also love that it collapses to store. I have thick curly hair (3A and 3B), and so i was excited to try this. So far i am having two issues. One, it tends to collapse to smaller size during use, esp when i get it closer to my head. Not sure that's a good thing. Two, and this may be an issue of me not using it properly, it seems to make my hair too curly! I like having the longer thicker big curls, rather than the tighter smaller and collier curls - and when i air dry, i usually have big thick curls. But with this diffuser, i end up with smaller tighter curls, which is not exactly what i want. As a result, my hair overall ends up looking another 2-3 inches shorter because the curls are tighter and smaller. So if your hair is wavy and you want more curl definition, this might be great - but for me, going from curly to almost coils/kinky is not a plus. But on the plus side, it does give me good volume at the top of my head and the crown.","d":"2016-06","h":12,"v":true},"AB0152427":{"r":1,"t":"One Star","x":"didn't fit my hair dryer , returned it","d":"2018-04","h":0,"v":true},"AB0153857":{"r":1,"t":"Too much hot air :)","x":"I was excited to get this product, but all's it did was overheat my blow dryer. Very disappointed.","d":"2016-03","h":2,"v":true},"AB0155337":{"r":1,"t":"It melted my dryer","x":"This is the product my hair stylist used . I used it with my Revlon hair dryer and the dyer melted. There should be a warning do not use with plastic hand held hair dryer","d":"2022-12","h":0,"v":true},"AB0157130":{"r":1,"t":"Not for me","x":"I'm a mixed girl with very curly hair, not very kinky or hard to brush but lots of small curls (like a 3C). I decided to try this out to see if it could help my curls shape a bit better but all it did was turn my hair into a frizzy, nappy, unmanageable mess. Ended up damaging my ends trying to carefully brush it out since my hair looked terrible and had to straighten it in the end anyways. Might work better for less curly types. As for the diffuser itself, it constantly collapses and it didn't want to fit on my fairly standard sized blowdryer (Revlon) without a huge struggle. The silicone has no give at all. Disappointing considering how much it costs while being described as \"universal\"","d":"2020-03","h":3,"v":true},"AB0158955":{"r":1,"t":"I would like to return","x":"duffusier falls off my hair dryer I know I purchased in July but I was traveling and I used the sock I purchased also I just used the duffusier today 9/28/17, I would like to return, cause I cannot use it. please let me know thanks Esther Maxemow","d":"2017-09","h":0,"v":true},"AB0159099":{"r":2,"t":"Not the best option for travel","x":"I like the idea of this diffuser; however, it has not worked for me. I purchased it primarily for use when traveling (as hotels never have diffusers). Unfortunately, I have not yet found a hotel hair dryer that will accommodate this diffuser. The opening, while flexible, does not stretch and will likely not fit over the end of any portable-style dryer. Out of desperation, I've tried holding the diffuser close to the dryer nozzle with my other hand and noticed the diffuser collapses very easily. In short, it simply doesn't work well for travel.","d":"2017-04","h":1,"v":true},"AB0159550":{"r":1,"t":"Breaks within a couple times of use","x":"After only a few uses, it fell apart. I am very dissatisfied with this product.","d":"2019-06","h":0,"v":true},"AB0160947":{"r":3,"t":"Three Stars","x":"Doesn't shoot yo much air won't work for full sized room","d":"2017-01","h":0,"v":true},"AB0161019":{"r":2,"t":"Check the dimensions on your dryer first! Narrow collar.","x":"The collar is VERY narrow and I ripped mine when I attempted to attach it to my dryer. I didn't even get to use it one time. So sad. Be sure to check the dimensions on your dryer before ordering.","d":"2018-05","h":0,"v":true},"AB0161263":{"r":3,"t":"good, not great","x":"Tends to fall off easily so you gotta be careful. Otherwise, it works fine for what it costs.","d":"2018-03","h":0,"v":true},"AB0163244":{"r":2,"t":"Tips too short, collapses while drying.","x":"I didn’t like it it keeps collapsing and the sticks aren’t long enough. Waste of my life once again 😔","d":"2019-04","h":0,"v":true},"AB0164771":{"r":3,"t":"Collapses well! Doesn't stay in shape while in use","x":"It's ok for what it's worth as a collapsable diffuser, but, well, it does not keep the extended shape while I'm drying my hair. Appling the slightest amount of pressure it collapses. It works well enough that I will keep it for traveling due to its compact and lightweight features.","d":"2022-03","h":0,"v":true},"AB0164923":{"r":3,"t":"Average, not great","x":"This might work better for someone with finer/less hair than me but regardless, it'll do in a pinch. I flip my hair upside down to diffuse and my hair is so heavy and thick that it partially collapses the diffuser most time. Also, despite the little finger prong things, the hair just all sort of smooshes together at the root and takes ages to dry as there's no circulation. If my hair is already mostly dry, this can help finish it up or if I'm just trying to get a gel cast to set, this can handle it but for thorough diffusing this doesn't really cut it for me.","d":"2017-06","h":3,"v":true},"AB0165049":{"r":1,"t":"Low quality","x":"Broken on 3rd use","d":"2021-04","h":0,"v":true},"AB0166843":{"r":2,"t":"Does not fit all dryers listed.","x":"Broke my dryer trying to get it on.","d":"2018-02","h":0,"v":true},"AB0169103":{"r":3,"t":"It’s okay","x":"I have two diffusers but this one it collapses very easily during the time I’m using it. Not my favorite one to use","d":"2020-11","h":0,"v":true},"AB0175322":{"r":1,"t":"Afraid to use again smells like burning hair","x":"My hair gets stuck in it and burned not good","d":"2020-09","h":0,"v":true},"AB0176436":{"r":2,"t":"Not my favorite","x":"Only fit on 1 dryer out of 4. It does tend to collapse if you press too hard. The prongs are too short, in my opinion. It seems to be able to travel well, its compact. Was not for me.","d":"2021-09","h":0,"v":true},"AB0176925":{"r":3,"t":"NOT for the Airwrap!","x":"I received a Dyson Airwrap fro Christmas and as an almost exclusively curly-girl, I was disappointed that a diffuser is the only attachment they didn't think of. After looking around for a silicone/flexible neck diffuser, I settled on this one. I may order a different model, since this is not a good fit at all. However, while holding it onto the dryer and using it, I was very pleased with how it worked, so there's that. If it will fit snuggly on your dryer, this will be a great diffuser.","d":"2021-01","h":1,"v":true},"AB0176939":{"r":3,"t":"Gets the job done.","x":"Love that this is collapsible. But sometimes finds that when your drying your hair that it collapses a little and folds up when trying to dry your hair. But it gets the job done.","d":"2019-08","h":0,"v":true},"AB0178492":{"r":1,"t":"Nunca me llegò este pedido","x":"Nunca me llegò este pedido","d":"2019-05","h":0,"v":true},"AB0179301":{"r":3,"t":"Does the job but collapses too easily","x":"Ok. Here's the thing. I WANT to leave a fantastic review for this. I really do. The company sent me emails with helpful tips and even responded with suggestions when I complained. They have been great. And it really does help my frizzy, flyaway thick curly hair! However... it collapses. Every, Single. Time. I've tried everything. The company suggested I pull it up further on the dryer. Didn't help. So, I do use it. And I love the results. But it's a huge pain in the butt to constantly pull back out every few seconds. They need a new design. :-/ It also arrived with a little black piece broken off and floating around inside of it. No idea if this piece is important or not. Seems to function without it. I'd return if it wasn't so much hassle.","d":"2016-06","h":9,"v":true},"AB0179708":{"r":1,"t":"Doesn't fit","x":"Thought it was universal","d":"2022-06","h":0,"v":true},"AB0180008":{"r":3,"t":"Wish it was deeper","x":"I love that it’s collapsible which is convenient for travel, but it’s not very deep, so it doesn’t give much room for my curls to sit in the cup part of the diffuser. Otherwise it works great. The part that goes on the hairdryer is a little stretchy so it should fit s wide variety of dryers.","d":"2019-01","h":0,"v":false},"AB0180214":{"r":1,"t":"Buyer Beware - \"Constructed to adapt to most any model of hair dryer\" NOT TRUE!!","x":"I purchase a lot of stuff off of Amazon and ALWAYS leave positive feedback, however, I am leaving this product only 1 Star because it does NOT fit my blow dryer which is a very common brand (Conair)! It states, in fact it's the second statement listed, (Constructed to adapt to most any model of hair dryer) one of the reasons I purchased this one. Well......it does not and will not adapt to my hair dryer. If it does NOT fit particular brands then The Curly Co. should list specifically what brands it does not fit so the consumer does NOT waste money/time purchasing an inferior product. Very unhappy to say the least!","d":"2017-06","h":53,"v":true},"AB0180613":{"r":3,"t":"worked great once it was on","x":"had a 15 minute struggle to get it onto my revlon blow dryer. worked great once it was on!","d":"2017-03","h":0,"v":true},"AB0180991":{"r":2,"t":"It broke after 4 months","x":"I loved this diffuser until it broke. Had it for 4 months and the knobby part at the end of the diffuser fell out. Guess I'll try and glue it back...","d":"2019-03","h":0,"v":true},"AB0181928":{"r":1,"t":"This does not fit a standard American hairdryer","x":"I’m kind of shocked at the reviews and question whether they’re real. I received this diffuser a few days ago. I primarily bought it to use in hotel rooms when I travel. I tried it out on my hairdryers at home. I own a Babyliss and the Dyson dryer. I don’t really need it for home but it couldn’t fit over the nozzle of either dryer. I also tried it on my daughters Dry bar hairdryer. It didn’t fit. I am currently staying in a hotel and it has a standard full size wall dryer and it doesn’t fit at all. I’ve attached pictures for size. I only bought this diffuser based on the reviews. This must only fit on a mini dryer. That’s all I can think of. Can’t report on how it works since I can’t use it.","d":"2019-02","h":14,"v":true},"AB0181980":{"r":2,"t":"Two Stars","x":"Doesn't really fit my hairdryer, despite being the size it says it can fit.","d":"2017-12","h":0,"v":true},"AB0182693":{"r":1,"t":"Don’t bother","x":"I bought this against my better judgement after reading several negative reviews. The item is poorly made, the part that is meant to hold the product into the blow dryer was detached AND wouldn’t fit a standard blow dryer even if it wasn’t broken.","d":"2019-03","h":0,"v":true},"AB0183655":{"r":1,"t":"Measure before you buy. Not one size fits all","x":"My fault for not measuring...did not fit my dryer","d":"2018-03","h":0,"v":true},"AB0184403":{"r":3,"t":"Did not fit any of my 3 hair dryers.","x":"I gave this item a 3 because I see the potential IF I had been able to get it to fit any of my 3 hair dryers. It was too small for all of them. I wanted it to work because I looked the thought of it being soft on my head while being pushed against my head. I did not return it because I tossed the papers that went with it thinking it would work.","d":"2020-10","h":0,"v":true},"AB0185043":{"r":2,"t":"DIDN'T FIT","x":"It didn't fit my Conair 1875 blow dryer (which has a 2-3/8\" wide opening). I was very disappointed, because the product is sturdy and looks well made. I wish it could have worked, because it's ability to collapse is a great concept. I will be returning it.","d":"2017-08","h":0,"v":true},"AB0185309":{"r":2,"t":"Meh.","x":"Flattens out too easily to be effective, though I suppose you could still use it. Not stretch enough to fit my travel dryer. Sits in a drawer unused.","d":"2018-03","h":0,"v":true},"AB0188188":{"r":2,"t":"Two Stars","x":"CHEAPLY MADE, BROKE ON FIRST ATTEMPT OF INSTALLATION","d":"2016-10","h":1,"v":true},"AB0190787":{"r":2,"t":"Doesn't work as well as my wife would have like. Because of the collapsible rubber piece","x":"Doesn't work as well as my wife would have like. Because of the collapsible rubber piece, it constantly folds in while she is trying to blow-dry her hair and can be frustrating. Wasn't worth it she said, but sh decided to keep it, just to have it, but wont be getting as much use as she planned on giving it.","d":"2017-12","h":0,"v":true},"AB0190991":{"r":1,"t":"Defective","x":"Even though this is the correct size for my blow dryer, it slips off if your dryer. . But worse than that is it collapses. The diffuser does not stay open. It keeps folding up. Not sure if I got a defective product or ?","d":"2022-11","h":0,"v":true},"AB0192412":{"r":1,"t":"Too small to fit on my dryer - definitely NOT stretchy. Phooey!","x":"Did not fit!","d":"2017-12","h":0,"v":true},"AB0192911":{"r":3,"t":"Ehh it's ok","x":"Still made my hair very frizzy. Had so many good reviews to.","d":"2020-06","h":0,"v":true},"AB0195825":{"r":1,"t":"So Flimsy","x":"This diffuser is awful. It crumbles under the weight of my hair and it's not very deep. I prefer finger diffusers shaped like a bowl. This one has a flat top so the hair just sits on top which takes my hair forever to dry.","d":"2019-07","h":0,"v":true},"AB0196119":{"r":1,"t":"Falls apart","x":"Falls apart. Poor quality pieces.","d":"2018-08","h":0,"v":true},"AB0199208":{"r":3,"t":"I have 3b curls and like to air dry my hair to avoid frizz","x":"I have 3b curls and like to air dry my hair to avoid frizz. I have heard great things about this product so i was excited to give it a try. A little disappointing. Since it is collapsible, the neck isnt very strong and it collapses any time I try to use it. perhaps i just got a dud. but im sad because i had high expectations.","d":"2017-08","h":0,"v":true},"AB0201987":{"r":2,"t":"Two Stars","x":"great for travel and packing, but as soon as it touches my head, the diffuser collapses","d":"2016-03","h":1,"v":true},"AB0202015":{"r":1,"t":"Collapses way to easy","x":"it fit the hair dryer nice but man it collapses so easy that when drying my hair it was was forever folding in on me with barley any pressure at all - will be returning it","d":"2021-01","h":0,"v":true},"AB0203205":{"r":1,"t":"Didnt fit after one use","x":"Hated this, waste of money.... didn't fit on hair dryer after one use. Already in the garbage.","d":"2018-01","h":0,"v":true},"AB0204280":{"r":2,"t":"Collapsed too easily.","x":"I ended up returning this because it kept collapsing when I pushed it against my scalp.","d":"2018-10","h":0,"v":true},"AB0207355":{"r":2,"t":"Quality seems good but has not fit any hairdryer in any hotel","x":"Does not fit most hairdryers. Quality seems good but has not fit any hairdryer in any hotel, so useless for travel for me.","d":"2018-01","h":1,"v":true},"AB0208185":{"r":1,"t":"Soooooooo disappointed!!","x":"Soooooooo disappointed!!! The description said \"universal\", and it is NOT. I have a Conair dryer, and its too small for it.","d":"2017-03","h":0,"v":true},"AB0208267":{"r":3,"t":"Good but broken","x":"It's great for traveling. I wish it was a bit more sturdy, it collapses easily when in use. I've had mine since Oct/Nov 2018 and just noticed it's separated. Most of the air now escapes through this large hole. Really bummed about the product quality.","d":"2021-12","h":1,"v":true},"AB0209036":{"r":2,"t":"but not easily. I constantly had to fight with it to ...","x":"Don't get me wrong, it got me through a 2 week vacation, but not easily. I constantly had to fight with it to get it to fit around nozzles that were too big, or hold it in place around nozzles that were too small. It never just fit on the end to where I could use it like a normal dryer. It needs some kind of resizeable attachment end with velcro it elastic or something to be more applicable.","d":"2016-08","h":1,"v":true},"AB0209077":{"r":1,"t":"Never worked right","x":"I tried really hard to give this a chance based on other reviews. I traveled to several different hotels, tried it on all kinds of different hair dryers. It never fit right, kept collapsing and was just a pain. I am now searching for a better travel hairdryer or different diffuser. So disappointed.","d":"2021-07","h":0,"v":true},"AB0211609":{"r":1,"t":"No buena inversión.","x":"Seca el cabello pero le da porosidad, al igual que a medida que se calienta se encoge por lo que hay que estar abriéndolo: Definitiva no fue una buena inversión.","d":"2020-06","h":0,"v":true},"AB0213096":{"r":2,"t":"Doesn't stay expanded while using.","x":"I returned this item. While using it, it kept collapsing back into itself. Frustrating.","d":"2017-06","h":0,"v":false},"AB0215068":{"r":1,"t":"bummer","x":"Went on my first trip to try out this product. The dryer the hotel had was too big for the opening. Would help if the device was made of a stretcher material. Just finished my second trip, never fit blow dryer. This is a waist of money.","d":"2021-04","h":0,"v":true},"AB0215733":{"r":2,"t":"Disappointed","x":"This item really disappointed me. I'll start by saying I have thick hair, and that could be why, but all this did for me was create a huge mess. If you want a tangled birds nest then buy this! And it didn't even dry my hair.","d":"2016-08","h":1,"v":true},"AB0217312":{"r":1,"t":"The item did not fit four different brands of hair ...","x":"The item did not fit four different brands of hair dryers. How is listed as Universal when it doesn't fit blow dryers.","d":"2018-04","h":0,"v":true},"AB0218031":{"r":2,"t":"Get something more durable.","x":"The collapsible part is nice but it's tough when you're actually using it.","d":"2017-05","h":0,"v":true},"AB0218397":{"r":1,"t":"Collapsed","x":"To flimsy collapsed to easy so wasn’t able to dry hair. Would be perfect for traveling. But unfortunately I collapses once held on hair to dry.","d":"2019-07","h":0,"v":true},"AB0220601":{"r":1,"t":"doesn't fit my standard size Conair hair dryer.","x":"I have a Conair Ionic hair dryer. Pretty standard brand and pretty standard size. The outside of the nozzle on the hair dryer is a little more than 2.25 inches. The inside of the nozzle on this diffuser attachment is about 2 and 1/16 inches. No way will the rubber on the diffuser stretch to fit around the outside of my hair dryer nozzle. I don't understand why other people can attach theirs so easily. It's going back.","d":"2016-08","h":4,"v":true},"AB0222141":{"r":2,"t":"Very difficult to get on and off. The inside piece where my hair goes keeps falling","x":"Does not fit on my dryer easily and impossible to remove. The inside piece where my hair goes keeps falling out. Does not diffuse my hair well","d":"2023-03","h":0,"v":true},"AB0223100":{"r":2,"t":"Two Stars","x":"Too difficult to put on hairdryer","d":"2018-06","h":0,"v":true},"AB0223192":{"r":1,"t":"Poorly made","x":"Cheaply made. I bought it because I loved the collapsible feature for traveling. It doesn't work at all. It's constantly collapsing while I'm drying my hair.","d":"2016-08","h":1,"v":true},"AB0224982":{"r":3,"t":"Three Stars","x":"Flimsy, doesn't hold shape while styling","d":"2018-05","h":0,"v":true},"AB0226436":{"r":2,"t":"Does not fit a hair dryer with 2.25\" nozzle","x":"This seems like a great product, and I would have kept it if it had fit on my hair dryer. My hair dryer nozzle is 2.25\" wide, which is what the item description stated it would be compatible with. No such luck. Width of diffuser at point it would attach to the dryer is only 2\", and the silicone does not stretch enough to attach to my dryer. Unfortunately, this item is being returned :(","d":"2017-06","h":197,"v":true},"AB0228179":{"r":1,"t":"This thing sucks. Nothing but frizz","x":"If I could give it 0 stars, I would. This thing sucks. Nothing but frizz.","d":"2017-03","h":0,"v":true},"AB0231710":{"r":3,"t":"Does not fit ovular hair dryer nozzle","x":"My hair dryer has an ovular shape to its nozzle, and this does not fit over it. I thought the silicone might be a bit stretchier, but no matter how hard I try, it doesn't fit on. I'm very disappointed. I haven't even gotten a chance to use it. I also did not receive the booklet it advertises. UPDATE: I borrowed a hair dryer, so I added a star because the product does work well. I don't love that it collapses if it hits my scalp too hard. I can see how it would be the ideal travel attachment. It doesn't get hot to the touch. Again, it works well, but for the inconvenience of not fitting on my hair dryer, my rating remains.","d":"2016-01","h":1,"v":false},"AB0232188":{"r":3,"t":"... sure if I'm using it wrong but I feel like it makes my curls frizzier","x":"I'm not sure if I'm using it wrong but I feel like it makes my curls frizzier. It could be how I'm handling it though so don't take my word for it.","d":"2016-11","h":1,"v":true},"AB0232372":{"r":3,"t":"Just ok","x":"Fits my blow dryer, but constantly collapses while drying my hair.","d":"2016-03","h":0,"v":true},"AB0233125":{"r":2,"t":"Too Collapsible","x":"I liked that the diffuser attached to my blow dryer very nicely. It fit snug. But it's too collapsible. Everytime I touched it to my hair, it would collapse. I sent it back.","d":"2019-02","h":0,"v":true},"AB0233460":{"r":3,"t":"and feels like it might slip off","x":"It came right on time, with Prime 2-day shipping. But it came in a plastic baggie with the Curly Co logo on it. No product box, no instructions. Granted, I could be the only nerd out there who needs instructions on how to attach and use a diffuser. It was mostly the attaching that I needed help with. It was very difficult to attach to my blowdryer (a travel size Revlon, I think? I'm not sure, I originally bought it for helping my watercolor dry faster), and feels like it might slip off. To attach, I ended up putting the diffuser on the floor, pressing the barrel of my blowdryer into the attachment tube, and sort of peeling the attachment onto the dryer. My fingers got pinched and scraped in the process, and I pretty much had to put my full bodyweight into it. If my partner had been home, I would have asked him to do it since he used to throw people for fun (cheerleader) and would have had the required strength in one arm. Even so, it took me a solid 5 minutes of bodyweight and a few minutes of Googling to figure out if maybe the diffuser just wouldn't work with my dryer, or if I was doing it wrong. I haven't used the diffuser yet. It just got here 10 minutes ago. I'll update when I've used it a few times. **EDIT** I've now used this diffuser twice. It stays on well enough while I'm using it, but as someone else mentioned: collapsible means holding the diffuser the whole time anyway, because it keeps collapsing during use. Also, be prepared to go through the painful process of reattaching it EVERY time you want to use it. When I lay my dryer down when I'm done, at least 1/3 of the edge of the diffuser slips off the barrel every time. And although I no longer need to use my bodyweight and I've tried other ways of attaching the diffuser, the only one that works is getting my fingers in the silicone attachment ring of the diffuser and stretching it over my dryer. Doesn't sound like a big deal, but this material doesn't stretch well-- as a result, my index fingers and thumbs are visibly scraped, and one index nail got smashed between diffuser and dryer hard enough that one side of the nail is detached and bleeding. A+ job making this \"universal\" diffuser attachable by the women it's meant for, dev team!","d":"2016-05","h":0,"v":true},"AB0235680":{"r":1,"t":"Not Impressed","x":"Definitely did not see what the hype was about. This diffuser, at a minimum, creates a slight blockage to the air flow of the blow dryer. It did attach to the my blow dryer easily, but it felt cheap and continued to collapse while in use. As a curly girl, I like quality air distribution to get the job done. This didn't do for me- returned.","d":"2017-04","h":0,"v":true},"AB0236178":{"r":1,"t":"Is It Defective?","x":"Haven't had a chance to use it yet. put it on dryer to use and it came apart into 3 pieces. (see pictures). Also a picture of my dryer. Not sure if I got a defect. Not finding option to contact seller.","d":"2018-02","h":0,"v":true},"AB0237544":{"r":2,"t":"not sure why i bought this,","x":"not sure why i bought this, my wife looked at it (young african american girl) and just tossed it on the dresser where it has been every since it arrived","d":"2016-09","h":1,"v":true},"AB0237959":{"r":1,"t":"One Star","x":"Didn't fit on my hair dryer. I returned it.","d":"2018-03","h":0,"v":true},"AB0239779":{"r":3,"t":"Nothing special....","x":"Maybe user error or just that Im not the best at doing my hair but this wasn't anything special...","d":"2017-12","h":0,"v":true},"AB0239976":{"r":1,"t":"Disappointed.","x":"I couldn't fit this one two different hair dryers. When I finally found one it kind of fit, it collapsed into my head each time I tried to use it. Very disappointed.","d":"2016-06","h":1,"v":true},"AB0243684":{"r":3,"t":"Curly","x":"Not crazy about this product","d":"2019-04","h":0,"v":true},"AB0243981":{"r":1,"t":"Lousy - will not stay in hair dryer","x":"It does not work","d":"2022-10","h":0,"v":true},"AB0244639":{"r":1,"t":"Does not fit my ConAir travel dryer. Even though ...","x":"Does not fit my ConAir travel dryer. Even though it's stretchy, it's way to small for my travel hair dryer. Have to send it back.","d":"2016-05","h":2,"v":true},"AB0245166":{"r":2,"t":"Broken","x":"Arrived a little broken- it seems cool that it collapses and probably works well.","d":"2016-07","h":0,"v":true},"AB0245168":{"r":3,"t":"Good design, ok product","x":"I have very curly hair, so I need a diffuser to dry it. So I appreciate that it collapses for traveling purposes; however, I'm not sure how much it actually diffuses the air given the design. Still makes my hair pretty frizzy.","d":"2017-05","h":0,"v":true},"AB0245721":{"r":2,"t":"Lies Lies Lies","x":"I'm actually very disappointed in this product i thought it was going to be amazing I've seen so many videos on it and the end product in the videos is nothing what i experienced.","d":"2016-07","h":2,"v":true},"AB0246780":{"r":3,"t":"Three Stars","x":"It is very diffiuclt to place over hairdryer","d":"2016-09","h":1,"v":true},"AB0247451":{"r":3,"t":"My Experience Is It Really Doesn't \"Fit Most...\"","x":"I'm torn. This diffuser fits my home dryer very easily and I love the performance that I get when I use it. On the other hand, I selected this particular diffuser because of the \"fits most dryer\" selling point. I travel a fair amount, and I figured it would be a lot easier to take just this along than to tote a dryer and regular diffuser. Well, I have just returned from a two week road trip. I stayed at 6 different hotels, and this diffuser fit exactly none of the dryers in those hotels. So, while I will continue to use it at home and be happy with its performance there, it failed to meet my primary goal of getting to a more efficient way to pack for trips.","d":"2016-06","h":2,"v":true},"AB0247662":{"r":1,"t":"One Star","x":"Was not crazy how it dry my curls","d":"2016-08","h":2,"v":true},"AB0248121":{"r":3,"t":"Three Stars","x":"hard to place on hairdryer. too tight","d":"2018-08","h":0,"v":true},"AB0249945":{"r":2,"t":"I wanted to like this...","x":"I really wanted this to work for me as I love to travel and this diffuser would take up much less space than my regular one. Alas, it isn't going anywhere with me. This unit suffers from the same issue as others of its kind: it collapses too easily against your head when you're trying to use it. The merest touch against your hair causes it to buckle, so you have very little control over the diffuser. Additionally, the \"fingers\" that protrude from the bottom don't protrude nearly far enough, nor are there enough of them, to adequately hold/lift the curls or to help separate them into a soft, piece-y style. The diffuser DID diffuse the air stream from the dryer, but it didn't facilitate styling like my regular one does. Lastly, the opening that fits over the dryer barrel is very small, so it wouldn't fit over 3 of 4 dryers I tried. (I'm also in the market to replace my dryer.) I hope someone does come up with a workable travel diffuser. Unfortunately, for me anyway, this one doesn't cut it.","d":"2016-02","h":5,"v":true},"AB0250415":{"r":3,"t":"This diffuser is not universal. I had to borrow ...","x":"This diffuser is not universal. I had to borrow someone else’s dryer to test it on. Once I got it on and began scrunching my hair with it, it collapsed with little pressure. It’s still usable collapsed, and my hair came out okay. I just wish it was wider or had more stretch to it.","d":"2018-04","h":0,"v":true},"AB0251356":{"r":1,"t":"Don't waste your money","x":"This is a nice item to travel with but it doesn't work well as far as staying on the end of the hair dryer. I tried it on different hair dryers and the same thing with each one, it wouldn't stay on the end long enough to use unless you hold with your hand and that makes it very difficult to use","d":"2021-01","h":0,"v":true},"AB0253832":{"r":2,"t":"Good product but....","x":"I wanted this to fit my travel dryer and thought it would but sadly it didnt.didn't.. I kept it because I like the way it fits more dryers than one.","d":"2022-07","h":0,"v":true},"AB0255591":{"r":3,"t":"I like that it’s collapsible but because it collapses I find ...","x":"I like that it’s collapsible but because it collapses I find it tilts when I’m using it which I do not like. Also it doesn’t fit the end of my dryer well either - very difficult to get on the dryer end.","d":"2018-05","h":0,"v":true},"AB0257591":{"r":2,"t":"Very small, doesn't stretch","x":"Did not fit any of the dryers I tried... the attachment mouth has little to no give, there was no way it was stretching over a very normal-sized dryer. I ended up cutting off the end, out of necessity, but now it's even more worthless. DON'T WASTE YOUR MONEY!!","d":"2018-04","h":1,"v":true},"AB0258537":{"r":1,"t":"Doesn't work very well","x":"Doesn't work very well","d":"2018-08","h":0,"v":true},"AB0260843":{"r":2,"t":"Takes longer to dry!","x":"Wouldnt consider buying this. It sounds like a great idea for travel but its really not. I felt like it makes drying time 2x longer and it constantly collapses during use","d":"2019-06","h":0,"v":true},"AB0262652":{"r":3,"t":"good deal","x":"This diffuser is just okay. I noticed it dries my curls much thinner and helter-skelkter than they used to with the Orchid (also on Amazon). It does not expedite the already long drying process, but it gets the job done ultimately. I would totally take it along on a trip rather than allowing my hair to air dry.","d":"2020-02","h":0,"v":true},"AB0262817":{"r":1,"t":"Disappointed that it collapses too easy","x":"This diffuser is very d
